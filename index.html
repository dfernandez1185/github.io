function startExam(ex, n){
  if (examLock()) return;
  const ids = pickExam(ex, n);
  newSession(ids, "exam", {ex, dur: n*60*1000});
  go("exam-run");
}
function stopTimer(){ if (timerInt) clearInterval(timerInt); timerInt = null; $("#timer").hidden = true; }
function tick(){
  if (!P || P.mode!=="exam" || P.finished) return stopTimer();
  const left = Math.max(0, P.dur - (Date.now()-P.start));
  const m = Math.floor(left/60000), s = Math.floor(left/1000)%60;
  const t = $("#timer"); t.hidden = false; t.textContent = (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  if (left <= 0) { toast("Time is up. Your exam was submitted."); finishExam(); }
}
VIEWS["exam-run"] = function(){
  const v = $("#view");
  if (!P || P.mode!=="exam") return VIEWS.exam();
  if (!timerInt) { timerInt = setInterval(tick, 1000); } tick();
  const q = QMAP[P.ids[P.i]];
  const nAns = P.ids.filter(id => answered(QMAP[id], P.resp[id]) && (QMAP[id].ty!=="order" || P.touched && P.touched[id])).length;
  v.innerHTML = `<div style="display:grid;gap:10px">
    <div class="spread"><span class="qprog">${EXAMS[P.ex].code} · Question ${P.i+1} of ${P.ids.length} · ${nAns} answered</span>
      <button class="btn small" data-act="endexam">End exam &amp; score</button></div>
    <div class="progress"><i style="width:${pct(P.i+1,P.ids.length)}%"></i></div></div>
    ${questionHTML(q, P.i, P.ids.length, false)}
    <div class="qnav"><button class="btn" data-act="prev" ${P.i===0?"disabled":""}>Previous</button>
      ${P.i<P.ids.length-1?`<button class="btn primary" data-act="next">Next</button>`:`<button class="btn primary" data-act="endexam">Review &amp; submit</button>`}</div>
    <details class="panel"><summary style="cursor:pointer;font-weight:600">Question map</summary>
      <div class="palette" style="margin-top:12px">${P.ids.map((id,i)=>{ const qq=QMAP[id]; const a = answered(qq,P.resp[id]) && (qq.ty!=="order" || (P.touched&&P.touched[id])); return `<button data-act="jump" data-i="${i}" class="${a?"ans":""} ${P.flags[id]?"flag":""} ${i===P.i?"cur":""}" aria-label="Question ${i+1}${P.flags[id]?", flagged":""}">${i+1}</button>`;}).join("")}</div>
      <p class="note" style="margin-top:8px">Shaded = answered · underline = flagged</p></details>`;
  bindQuestion(q);
};
function finishExam(){
  if (!P || P.finished) return;
  P.finished = true; stopTimer();
  P.ids.forEach(id => { const q = QMAP[id]; const ok = isCorrect(q, P.resp[id]); P.ok[id] = ok; P.done[id] = true; record(id, ok); });
  const ok = P.ids.filter(id=>P.ok[id]).length;
  const frac = ok / P.ids.length;
  const scaled = Math.round(100 + 800*frac);
  const pass = scaled >= EXAMS[P.ex].pass;
  S.exams.push({ex:P.ex, date:Date.now(), n:P.ids.length, pct:Math.round(frac*100), scaled, pass}); save();
  P.result = {ok, scaled, pass, mins: Math.round((Date.now()-P.start)/60000)};
  route = "exam"; setNav();
  $("#view").innerHTML = ""; VIEWS["exam-results"]();
  window.scrollTo({top:0});
}

// ---------- highlight-to-lookup bubble ----------
const FRAGS = [];
KB.forEach(k => {
  const re = /<(li|p|tr)[^>]*>([\s\S]*?)<\/\1>/g; let m;
  while ((m = re.exec(k.body))) {
    const html = m[2]; const text = html.replace(/<\/t[dh]>/g, " — ").replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/\s+/g," ").trim();
    const bold = (html.match(/<b>([\s\S]*?)<\/b>/g) || []).map(b => norm(strip(b)));
    const first = m[1]==="tr" ? norm(strip((html.match(/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/)||["",""])[1])) : "";
    if (text.length > 8) FRAGS.push({k, text: text.replace(/\s—\s*$/,""), bold, first, n: norm(text)});
  }
});
const GLMAP = {}; GLOSSARY.forEach(([a,m]) => { GLMAP[norm(a).replace(/[^a-z0-9+]/g,"")] = [a,m]; });
function cleanTerm(s){ return String(s).replace(/\s+/g," ").trim().replace(/^[^A-Za-z0-9.+$]+|[^A-Za-z0-9+$)]+$/g,""); }
function defineTerm(term){
  const out = {term, acro:null, notes:[], plain:null};
  const key = norm(term).replace(/[^a-z0-9+]/g,"");
  { const tt = norm(term).replace(/\s+/g," "); out.plain = TERMS[tt] || TERMS[tt.replace(/s$/,"")] || TERMS[tt.replace(/es$/,"")] || null; }
  out.acro = GLMAP[key] || (key.endsWith("s") && GLMAP[key.slice(0,-1)]) || null;
  const t = norm(term); const tSing = t.replace(/s$/,"");
  const scored = FRAGS.map(f => {
    let s = 0;
    if (f.first && (f.first === t || f.first.startsWith(t+" ") || f.first.startsWith(tSing))) s += 12;
    if (f.bold.some(b => b === t || b === tSing || b.startsWith(t+" ") || b.replace(/[^a-z0-9 ]/g,"") === t)) s += 10;
    else if (f.bold.some(b => has(b, t))) s += 5;
    if (has(f.n, t)) s += 3; else if (t.length > 3 && f.n.includes(tSing)) s += 2;
    if (s && f.n.indexOf(t) >= 0 && f.n.indexOf(t) < 25) s += 2;
    if (s && f.text.length > 320) s -= 2;
    if (s && f.first && !f.first.includes(tSing)) s -= 2;
    return {f, s};
  }).filter(x => x.s >= 3).sort((a,b) => b.s - a.s);
  const seen = new Set();
  for (const x of scored) { if (seen.has(x.f.text)) continue; seen.add(x.f.text); out.notes.push(x.f); if (out.notes.length >= (out.plain ? 1 : 2)) break; }
  return out;
}

  if (d.acro) html += `<p class="lk-acro"><span class="mono">${esc(d.acro[0])}</span> stands for <b>${esc(d.acro[1])}</b>.</p>`;
  if (d.plain) html += `<p class="lk-def lk-plain">${esc(d.plain)}</p>`;
  d.notes.forEach(f => { html += `<p class="lk-def${d.plain||d.acro?" lk-more":""}">${esc(f.text.length>300?f.text.slice(0,297)+"…":f.text)}</p><p class="lk-src">${modLabel(f.k.m)} · ${esc(f.k.title)} <button type="button" class="lk-link" data-act="note" data-id="${f.k.id}">Open note</button></p>`; });
  if (!d.acro && !d.plain && !d.notes.length) html += `<p class="lk-def muted">No quick definition in the app for this term.${sampleFn?" Ask the tutor below, or try Search.":" Try Search for related notes."}</p>`;
  html += `<div class="lk-foot"><button type="button" class="lk-link" data-lk="search">Search instead</button>${sampleFn?`<button type="button" class="lk-link" data-lk="tutor">Ask the tutor to explain</button>`:""}</div><div class="lk-tutor" hidden></div>`;
  bubble.innerHTML = html; bubble.classList.add("open"); placeBubble(bubble._rect);
}
function showSearch(){
  const r = search(bubbleTerm);
  let html = `<div class="lk-head"><span class="eyebrow">Where to find it</span><b>${esc(bubbleTerm)}</b><button type="button" class="lk-x" data-lk="close" aria-label="Close">×</button></div>`;
  if (r.kb.length) html += `<div class="lk-refs">${r.kb.slice(0,3).map(x => `<button type="button" class="lk-ref" data-act="note" data-id="${x.k.id}"><span class="tag teal">${modLabel(x.k.m)}</span><span>${esc(x.k.title)}<small>${esc(modTitle(x.k.m))}</small></span></button>`).join("")}</div>`;
  const vids = r.vids.length ? r.vids.slice(0,2) : (r.kb[0] ? videosFor(r.kb[0].k.id).slice(0,2) : []);
  if (vids.length) html += `<div class="vids lk-vids">${vids.map(vidLink).join("")}</div>`;
  if (!r.kb.length && !vids.length) html += `<p class="lk-def muted">No study notes match this term.</p>`;
  html += `<div class="lk-foot"><button type="button" class="lk-link" data-lk="all">See all results${r.qs.length?` (${r.qs.length} questions)`:""}</button><button type="button" class="lk-link" data-lk="define">Define instead</button></div>`;
  bubble.innerHTML = html; bubble.classList.add("open"); placeBubble(bubble._rect);
}
function selectionTerm(){
  const sel = window.getSelection(); if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const node = sel.anchorNode && (sel.anchorNode.nodeType===1 ? sel.anchorNode : sel.anchorNode.parentElement);
  if (!node || !node.closest("#view, #sheet") || node.closest("input, textarea, .lookup, button")) return null;
  const term = cleanTerm(sel.toString());
  if (term.length < 2 || term.length > 60 || term.split(" ").length > 6) return null;
  const rect = sel.getRangeAt(0).getBoundingClientRect(); if (!rect.width && !rect.height) return null;
  return {term, rect};
}
function onSelect(){
  clearTimeout(selTimer);
  selTimer = setTimeout(() => {
    if (bubble && bubble.classList.contains("open")) return;
    const s = selectionTerm(); if (s) showChooser(s.term, s.rect); else hideBubble();
  }, 220);
}
document.addEventListener("selectionchange", onSelect);
document.addEventListener("mousedown", e => { if (bubble && !bubble.hidden && !e.target.closest(".lookup")) hideBubble(); });
document.addEventListener("touchstart", e => { if (bubble && !bubble.hidden && !e.target.closest(".lookup")) { bubble.classList.remove("open"); } }, {passive:true});
document.addEventListener("keydown", e => { if (e.key === "Escape" && bubble && !bubble.hidden) hideBubble(); });
window.addEventListener("scroll", () => { if (bubble && !bubble.hidden && !bubble.classList.contains("open")) hideBubble(); }, {passive:true});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lk]"); if (!b) { if (e.target.closest(".lookup [data-act]")) hideBubble(); return; }
  const a = b.dataset.lk;
  if (a === "define") return showDefine();
  if (a === "search") return showSearch();
  if (a === "close") { hideBubble(); window.getSelection().removeAllRanges(); return; }
  if (a === "all") { const t = bubbleTerm; hideBubble(); if (P && P.mode==="exam" && !P.finished) return toast("Search is available after the exam."); closeModal(); lastQuery = t; return go("study", t); }
  if (a === "tutor") {
    const box = bubble.querySelector(".lk-tutor"); box.hidden = false; box.innerHTML = `<div class="out"></div>`;
    const r = search(bubbleTerm);
    runTutor(tutorPrompt("Define \"" + bubbleTerm + "\" in the context of CompTIA A+ in 2-4 sentences, then give one exam tip.", r.kb.map(x=>x.k)), box.querySelector(".out"));
  }
});

go("home");
})();

</script>
