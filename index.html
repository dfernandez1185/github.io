{d:1,t:"windows-tools",ty:"mc",q:"Which utility lets a technician configure the next boot into Safe Mode from within Windows?",o:["msconfig","regedit","dxdiag","cleanmgr"],a:0,e:"System Configuration (msconfig) → Boot tab → Safe boot."},
{d:1,t:"windows-tools",ty:"mc",q:"A technician needs to quickly view the installed RAM, BIOS version and hardware resources. Which tool provides this summary?",o:["msinfo32","perfmon","eventvwr","lusrmgr"],a:0,e:"System Information (msinfo32) summarizes hardware and software."},
{d:1,t:"windows-tools",ty:"mc",q:"A computer is slow to start. Where can a user quickly disable programs that launch at sign-in?",o:["Task Manager → Startup apps","Disk Management","Device Manager","Event Viewer"],a:0,e:"The Startup apps tab in Task Manager (or Settings → Apps → Startup) shows startup impact and allows disabling."},
{d:1,t:"cmd-tools",ty:"mc",q:"Which command repairs corrupted protected Windows system files?",o:["sfc /scannow","chkdsk /f","gpupdate /force","format c:"],a:0,e:"System File Checker restores protected system files from a cache."},
{d:1,t:"cmd-tools",ty:"mc",q:"Which command checks a volume for file system errors and locates bad sectors?",o:["chkdsk /r","sfc /scannow","diskpart","robocopy"],a:0,e:"chkdsk /r locates bad sectors and recovers readable data (it implies /f)."},
{d:1,t:"cmd-tools",ty:"mc",sc:"An administrator changed a Group Policy setting and wants a workstation to apply it immediately rather than waiting.",q:"Which command should be run on the workstation?",o:["gpupdate /force","gpresult /r","netstat","winver"],a:0,e:"gpupdate /force reapplies all policies now. gpresult shows which policies are applied."},
{d:1,t:"cmd-tools",ty:"mc",q:"Which command shows the Group Policy settings currently applied to a user and computer?",o:["gpresult /r","gpupdate","sfc","hostname"],a:0,e:"gpresult displays the Resultant Set of Policy."},
{d:1,t:"cmd-tools",ty:"mc",q:"Which command maps drive letter S: to the share \\\\files01\\sales?",o:["net use S: \\\\files01\\sales","net user S: \\\\files01\\sales","map S: files01","diskpart assign S"],a:0,e:"net use connects a drive letter to a shared folder."},
{d:1,t:"cmd-tools",ty:"mc",q:"Which command copies files with automatic retries, can mirror directory trees, and logs results?",o:["robocopy","copy","xcopy","move"],a:0,e:"Robocopy (Robust File Copy) is designed for reliable, large copy jobs."},
{d:1,t:"cmd-tools",ty:"mc",q:"Which command quickly displays the Windows version and build number?",o:["winver","ver /all","hostname","msconfig"],a:0,e:"winver opens a dialog with the edition, version and build."},
{d:1,t:"cmd-tools",ty:"mc",q:"A technician runs sfc /scannow and gets a message that she must be an administrator. What should she do?",o:["Open Command Prompt as administrator (elevated)","Run it in Safe Mode only","Use gpupdate","Log in as Guest"],a:0,e:"Many system commands require an elevated prompt."},
{d:1,t:"cmd-tools",ty:"sa",q:"What is the difference between chkdsk and sfc?",k:[["chkdsk"],["disk","file system","sector","volume"],["sfc"],["system file","windows file","protected"]],ans:"chkdsk checks a disk volume's file system for errors and (with /r) bad sectors. sfc (System File Checker) scans and repairs corrupted or missing protected Windows system files.",e:"chkdsk = disk/file system health; sfc = Windows system files."},
{d:1,t:"net-commands",ty:"mc",q:"Which command clears the DNS resolver cache on a Windows computer?",o:["ipconfig /flushdns","ipconfig /release","nslookup /clear","netstat -r"],a:0,e:"ipconfig /flushdns removes cached DNS entries."},
{d:1,t:"net-commands",ty:"mc",sc:"A user can ping 8.8.8.8 successfully but can't open any website by name.",q:"Which tool would BEST help confirm the cause?",o:["nslookup","tracert","netstat","hostname"],a:0,e:"Reaching an IP but not names points to DNS; nslookup tests name resolution."},
{d:1,t:"net-commands",ty:"mc",q:"Which command shows every router hop between a PC and a remote server?",o:["tracert","ping","ipconfig","net use"],a:0,e:"tracert lists each hop; pathping adds packet-loss statistics per hop."},
{d:1,t:"net-commands",ty:"mc",q:"Which command lists active TCP connections and listening ports?",o:["netstat","nslookup","ipconfig","tracert"],a:0,e:"netstat -an shows connections and ports; -b shows the owning program."},
{d:1,t:"net-commands",ty:"order",q:"A user has no internet. Put these basic connectivity tests in a logical order.",o:["ipconfig /all to check for a valid address","ping 127.0.0.1 (loopback)","ping the default gateway","ping a public IP address","ping a website by name"],e:"Work outward: local config, the TCP/IP stack, the LAN gateway, the internet, then DNS."},
{d:1,t:"settings-cpl",ty:"mc",q:"A user can't see a folder named AppData in her user profile. Which setting should be changed?",o:["File Explorer Options: show hidden files","Power Options","Indexing Options","Sound"],a:0,e:"AppData is hidden by default; File Explorer Options can show hidden items."},
{d:1,t:"settings-cpl",ty:"mc",sc:"A user wants his laptop to use no power while closed for a weekend but resume exactly where he left off.",q:"Which power option should he use?",o:["Sleep","Hibernate","Shut down","Fast startup"],a:1,e:"Hibernate saves RAM contents to disk and powers off completely, then restores the session."},
{d:1,t:"settings-cpl",ty:"mc",q:"Which Control Panel utility shows network adapters and lets a user change adapter settings?",o:["Network and Sharing Center","Programs and Features","Mail","Ease of Access"],a:0,e:"Network and Sharing Center → Change adapter settings."},
{d:1,t:"windows-updates",ty:"mc",q:"A user with 32-bit Windows tries to install a 64-bit application. What happens?",o:["It installs normally","It won't install; 64-bit apps require a 64-bit OS","It runs in compatibility mode","It converts to 32-bit"],a:1,e:"A 64-bit OS runs 32- and 64-bit apps; a 32-bit OS can't run 64-bit apps."},
{d:1,t:"windows-updates",ty:"multi",q:"Before installing a 3D design application, which THREE requirements should be checked? (Choose three.)",o:["RAM","Dedicated graphics card/VRAM","Available storage","Monitor brand","Keyboard layout"],a:[0,1,2],e:"Check RAM, graphics/VRAM, storage, OS architecture and any license tokens."},
{d:1,t:"workgroup-domain",ty:"mc",q:"In a workgroup, where are user accounts stored?",o:["On each individual computer","On a domain controller","In the cloud only","On the router"],a:0,e:"Workgroups are peer-to-peer with local accounts on each PC."},
{d:1,t:"macos",ty:"mc",q:"Which macOS feature backs up files automatically to an external drive?",o:["Time Machine","FileVault","Spotlight","Keychain"],a:0,e:"Time Machine makes hourly, daily and weekly backups."},
{d:1,t:"macos",ty:"mc",q:"Which macOS feature provides full-disk encryption?",o:["Gatekeeper","FileVault","Boot Camp","Mission Control"],a:1,e:"FileVault encrypts the startup disk."},
{d:1,t:"macos",ty:"mc",q:"Which macOS tool stores saved website passwords, Wi-Fi passwords and certificates?",o:["Finder","Keychain Access","Disk Utility","Terminal"],a:1,e:"Keychain securely stores credentials and certificates."},
{d:1,t:"macos",ty:"mc",sc:"A Mac user's app is frozen and won't respond to clicks.",q:"Which key combination opens the Force Quit window?",o:["Ctrl+Alt+Delete","Command+Option+Esc","Command+Space","Shift+F10"],a:1,e:"Command+Option+Escape opens Force Quit Applications."},
{d:1,t:"macos",ty:"mc",q:"Which macOS file type is a mountable disk image that usually contains an app to drag into the Applications folder?",o:[".pkg",".dmg",".exe",".msi"],a:1,e:".dmg is a disk image; .pkg is an installer package; .app is the application bundle."},
{d:1,t:"macos",ty:"mc",q:"Which macOS utility repairs disk errors with First Aid and can partition drives?",o:["Disk Utility","Activity Monitor","Console","Spotlight"],a:0,e:"Disk Utility formats, partitions and repairs drives."},
{d:1,t:"linux",ty:"mc",q:"Which Linux command shows the current working directory?",o:["pwd","ls","cd","dir"],a:0,e:"pwd prints the working directory."},
{d:1,t:"linux",ty:"mc",q:"A Linux user needs to run a single command with root privileges. Which command should precede it?",o:["sudo","su","chmod","root"],a:0,e:"sudo runs one command as root; su switches to another user (root by default)."},
{d:1,t:"linux",ty:"mc",q:"Which command changes a file's permissions so the owner has read, write and execute, and group and others have read and execute?",o:["chmod 755 file","chmod 644 file","chown 755 file","chmod 777 file"],a:0,e:"7 = rwx (4+2+1), 5 = r-x (4+1). 755 = rwxr-xr-x."},
{d:1,t:"linux",ty:"mc",q:"Which command installs software on an Ubuntu/Debian system?",o:["apt install","dnf install","brew install","msiexec"],a:0,e:"apt is the Debian/Ubuntu package manager; dnf is used on Fedora/Red Hat."},
{d:1,t:"linux",ty:"mc",q:"Which Linux command searches a file for lines containing a specific word?",o:["grep","find","cat","ps"],a:0,e:"grep searches text for a pattern. find locates files by name or attributes."},
{d:1,t:"linux",ty:"mc",q:"Which Linux command shows free space on mounted file systems?",o:["df","du","top","ip"],a:0,e:"df reports file system free space; du reports directory usage."},
{d:1,t:"linux",ty:"mc",q:"Where are most system configuration files stored in Linux?",o:["/etc","/home","/var","/bin"],a:0,e:"/etc holds configuration files; /var holds logs; /home holds user folders."},
{d:1,t:"linux",ty:"sa",q:"Name the Linux commands to (1) list files, (2) change a file's owner, and (3) view running processes.",k:[["ls"],["chown"],["ps","top"]],ans:"(1) ls, (2) chown, (3) ps (or top for a live view).",e:"Memorize the core Linux command list for Core 2."},

// ---------- Domain 3: Software Troubleshooting ----------
{d:3,t:"sw-troubleshoot",ty:"mc",sc:"A user's PC became very slow over the past week. Task Manager shows an unfamiliar process using 95% CPU constantly.",q:"What should the technician suspect FIRST?",o:["Malware such as a cryptominer","Insufficient RAM","A failing monitor","Wrong time zone"],a:0,e:"An unknown process using high CPU is a classic sign of malware (e.g., cryptomining). Investigate and scan."},
{d:3,t:"sw-troubleshoot",ty:"mc",q:"A Windows service won't start and reports a dependency error. Where should the technician look to resolve it?",o:["Services console: check the dependencies tab and dependent services","Disk Management","Device Manager","Certificate Manager"],a:0,e:"services.msc shows dependencies; start required services first, and check Event Viewer."},
{d:3,t:"sw-troubleshoot",ty:"mc",sc:"A user gets a message that her profile couldn't be loaded and she is logged into a temporary profile.",q:"What is the BEST fix?",o:["Rebuild the user profile and copy her data to it","Reinstall Windows","Replace the hard drive","Change her password"],a:0,e:"A corrupted profile can be rebuilt; back up data, rename or remove the old profile, log in fresh, then restore files."},
{d:3,t:"sw-troubleshoot",ty:"mc",q:"A computer's clock gradually becomes several minutes wrong, causing authentication errors on the domain. What should be checked?",o:["Time synchronization settings and the CMOS battery","The DNS cache","The printer driver","The page file"],a:0,e:"Time drift breaks Kerberos authentication. Sync with a time source and check the CMOS battery."},
{d:3,t:"sw-troubleshoot",ty:"mc",q:"After a recent driver update, a laptop's display flickers. What is the QUICKEST fix?",o:["Roll back the driver in Device Manager","Reimage the laptop","Replace the screen","Run chkdsk"],a:0,e:"Rolling back restores the previous working driver."},
{d:3,t:"sw-troubleshoot",ty:"mc",q:"Which Windows feature reverts system files, registry settings and installed apps to an earlier point without affecting personal documents?",o:["System Restore","File History","Reset this PC","Disk Cleanup"],a:0,e:"System Restore uses restore points; it doesn't restore or delete personal files."},
{d:3,t:"sw-troubleshoot",ty:"mc",sc:"A user plugs a webcam, headset, flash drive and phone charger into a USB hub. Windows shows 'USB controller resource' warnings and the webcam fails.",q:"What is the BEST fix?",o:["Move some devices to a port on a different USB controller","Reinstall Windows","Replace the webcam","Disable Windows Update"],a:0,e:"Too many devices on one controller can exhaust its resources; spread them out."},
{d:3,t:"sw-troubleshoot",ty:"mc",q:"An application crashes every time it opens after a Windows feature update. What should the technician try FIRST?",o:["Update or repair the application","Reinstall Windows","Replace RAM","Disable the firewall"],a:0,e:"Update, repair, or reinstall the app; check vendor compatibility and Event Viewer."},
{d:3,t:"sw-troubleshoot",ty:"mc",q:"Low memory warnings appear while a user runs several large apps. Which is a valid remediation?",o:["Increase the paging file or add RAM","Disable System Restore","Format the drive","Remove the CMOS battery"],a:0,e:"Adding RAM or increasing virtual memory addresses memory exhaustion."},
{d:3,t:"sw-troubleshoot",ty:"sa",q:"A Windows 11 PC has become sluggish. List three things you would check or do.",k:[["task manager","resource","cpu","process"],["startup"],["malware","virus","scan"],["disk space","storage","free space","ram","memory","update"]],ans:"Check Task Manager for processes using high CPU, memory or disk; disable unnecessary startup apps; scan for malware; confirm free disk space and adequate RAM; apply updates.",e:"Identify the resource bottleneck, then remove the cause."},
{d:3,t:"startup-troubleshoot",ty:"mc",sc:"After installing a new graphics driver, Windows shows a stop error every time it starts.",q:"What should the technician do?",o:["Boot into Safe Mode and roll back or remove the driver","Replace the graphics card","Run sfc from Windows normally","Reformat the drive"],a:0,e:"Safe Mode loads basic drivers so you can roll back the faulty driver. System Restore is another option."},
{d:3,t:"startup-troubleshoot",ty:"mc",q:"Which commands rebuild the boot configuration data when Windows reports a missing boot loader?",o:["bootrec /rebuildbcd","sfc /scannow","gpupdate /force","chkdsk /x"],a:0,e:"bootrec (/fixmbr, /fixboot, /rebuildbcd) repairs boot records from WinRE."},
{d:3,t:"startup-troubleshoot",ty:"mc",q:"How can a user reach the Windows Recovery Environment from the sign-in screen?",o:["Hold Shift while clicking Restart","Press Ctrl+Alt+Del twice","Press F1 at the desktop","Run msinfo32"],a:0,e:"Shift+Restart opens advanced startup options in WinRE."},
{d:3,t:"startup-troubleshoot",ty:"mc",q:"Which Safe Mode option should be used if the technician needs to download a driver while troubleshooting?",o:["Safe Mode with Networking","Safe Mode with Command Prompt","Enable boot logging","Low-resolution video"],a:0,e:"Safe Mode with Networking loads network drivers."},
{d:3,t:"startup-troubleshoot",ty:"mc",sc:"A PC shows 'No operating system found.' The drive is detected in UEFI, and nothing has changed in the boot order.",q:"What should the technician try?",o:["Run Startup Repair or bootrec from WinRE","Replace the monitor","Update the printer driver","Reset the CMOS battery only"],a:0,e:"With the disk detected, repair the boot loader using Startup Repair or bootrec."},
{d:3,t:"startup-troubleshoot",ty:"mc",q:"A Windows PC is badly corrupted and the user wants to reinstall Windows while keeping personal files. Which option is BEST?",o:["Reset this PC with 'Keep my files'","System Image Recovery from last year","Format and clean install","Disk Cleanup"],a:0,e:"Reset this PC can reinstall Windows and keep personal files (apps are removed)."},
{d:3,t:"startup-troubleshoot",ty:"order",q:"Put the UEFI/Windows startup sequence in order.",o:["POST","UEFI firmware locates the EFI system partition","Windows Boot Manager runs","Windows Boot Loader (winload) loads the kernel","Kernel starts services and drivers","User sign-in"],e:"Firmware → Boot Manager → Boot Loader → kernel → services → logon."},
{d:3,t:"startup-entry",ty:"mc",q:"Malware keeps relaunching at every sign-in even after the process is ended. Which location should be checked for a startup entry?",o:["Registry Run keys and the Startup folder","The Recycle Bin","Device Manager","Disk Management"],a:0,e:"Run/RunOnce registry keys, Startup folders, scheduled tasks and services are common startup entry points."},
{d:3,t:"mobile-os-troubleshoot",ty:"mc",q:"A phone app closes immediately every time it opens. What should the user try FIRST?",o:["Force close, clear the app cache, and update or reinstall the app","Factory reset the phone","Replace the battery","Disable cellular data"],a:0,e:"Start with the least invasive fixes for an app problem."},
{d:3,t:"mobile-os-troubleshoot",ty:"mc",q:"A tablet doesn't rotate the screen when turned sideways. What should be checked FIRST?",o:["Rotation lock setting","Battery health","Wi-Fi settings","Storage space"],a:0,e:"Rotation lock or an app that doesn't support rotation is the usual cause."},
{d:3,t:"mobile-os-troubleshoot",ty:"mc",q:"A phone won't install the latest OS update. Which is a likely cause?",o:["Insufficient storage space or low battery","Bluetooth is on","Screen brightness is high","The SIM card is new"],a:0,e:"Updates need free space, sufficient battery, network access, and a supported device."},
{d:3,t:"mobile-os-troubleshoot",ty:"mc",sc:"A user's phone has suddenly started using far more data than usual, the battery drains quickly, and she receives fake 'virus detected' pop-ups.",q:"What is the MOST likely cause?",o:["Malware on the device","A failing screen","A weak cellular signal","An expired SIM"],a:0,e:"High data use, battery drain and fake security warnings are signs of compromise."},
{d:3,t:"mobile-os-troubleshoot",ty:"multi",q:"Which TWO are security risks on a company-managed smartphone? (Choose two.)",o:["Jailbreaking/rooting the device","Sideloading apps from unofficial sources","Enabling automatic OS updates","Using a PIN screen lock","Enabling remote wipe"],a:[0,1],e:"Jailbreaking/rooting and sideloading bypass the platform's security model."},
{d:3,t:"browser-security",ty:"mc",sc:"A user's browser home page has changed to an unfamiliar search site, and searches are redirected to ad pages.",q:"What is the MOST likely cause?",o:["Browser hijacker malware or a malicious extension","A DNS cache problem","The ISP is down","An expired certificate"],a:0,e:"Unexpected redirects and changed home pages indicate browser hijacking; remove the extension/malware and reset browser settings."},
{d:3,t:"browser-security",ty:"mc",q:"Every HTTPS website shows a certificate error on one PC only. Which is the MOST likely cause?",o:["The PC's date and time are wrong","All websites have expired certificates","The monitor resolution is wrong","The DNS server is offline"],a:0,e:"An incorrect clock makes valid certificates appear expired or not yet valid."},
{d:3,t:"sw-troubleshoot",ty:"mc",q:"Which tool provides a timeline of app failures, Windows failures and updates to help spot when problems began?",o:["Reliability Monitor","Disk Management","Certificate Manager","Character Map"],a:0,e:"Reliability Monitor (in Security and Maintenance) graphs stability over time."}
];

// Core 2 (220-1202) questions, part B
const Q2B = [
// ---------- Domain 2: Security ----------
{d:2,t:"physical-security",ty:"mc",q:"Which physical control uses two doors, where the first must close before the second opens, to prevent tailgating?",o:["Bollards","Access control vestibule","Badge reader","Motion sensor"],a:1,e:"An access control vestibule (mantrap) allows only one person through at a time."},
{d:2,t:"physical-security",ty:"mc",q:"Which physical security control prevents vehicles from crashing into a building entrance?",o:["Bollards","Fences","Magnetometer","Video surveillance"],a:0,e:"Bollards are sturdy posts that block vehicles."},
{d:2,t:"auth",ty:"mc",q:"A user signs in with a password and then approves a push notification on her phone. Which authentication factors are used?",o:["Something you know and something you have","Something you know and something you are","Two things you know","Something you are and somewhere you are"],a:0,e:"Password = know; phone = have."},
{d:2,t:"auth",ty:"mc",q:"Which MFA method is generally considered LEAST secure?",o:["SMS text message codes","Hardware token","Authenticator app","Biometrics"],a:0,e:"SMS codes can be intercepted or redirected via SIM swapping."},
{d:2,t:"auth",ty:"mc",sc:"A new employee in accounts payable was given administrator rights 'to make things easier.'",q:"Which security principle does this violate?",o:["Least privilege","Zero trust","Defense in depth","Separation of duties"],a:0,e:"Users should have only the minimum permissions needed for their job."},
{d:2,t:"auth",ty:"mc",q:"A security model that requires verification for every access request, even from inside the network, is called:",o:["Zero trust","Least privilege","Implicit trust","Perimeter security"],a:0,e:"Zero trust: never trust, always verify."},
{d:2,t:"auth",ty:"mc",q:"Which technology lets a user sign in once and access many applications without signing in again?",o:["SSO","MFA","ACL","EFS"],a:0,e:"Single sign-on (SSO)."},
{d:2,t:"wireless-security",ty:"mc",q:"Which wireless security protocol uses SAE to protect against offline dictionary attacks?",o:["WPA3","WPA2","WEP","WPA with TKIP"],a:0,e:"WPA3-Personal uses Simultaneous Authentication of Equals (SAE)."},
{d:2,t:"wireless-security",ty:"mc",q:"Which encryption type should be used with WPA2?",o:["AES","TKIP","WEP","RC4"],a:0,e:"AES (CCMP) is strong; TKIP is legacy and weak."},
{d:2,t:"wireless-security",ty:"mc",sc:"A company wants each employee to log on to Wi-Fi with their own network credentials instead of a shared password.",q:"What should be configured?",o:["WPA3-Enterprise with a RADIUS server","WPA2-Personal","An open network with a captive portal","WEP with MAC filtering"],a:0,e:"Enterprise mode uses 802.1X with a RADIUS server for per-user authentication."},
{d:2,t:"wireless-security",ty:"mc",q:"Which AAA protocol uses TCP and encrypts the entire payload, and is commonly used for network device administration?",o:["TACACS+","RADIUS","Kerberos","LDAP"],a:0,e:"TACACS+ uses TCP and encrypts the full packet; RADIUS uses UDP and encrypts only the password."},
{d:2,t:"wireless-security",ty:"mc",q:"Which authentication protocol issues tickets and is used by Active Directory?",o:["Kerberos","TACACS+","RADIUS","SAE"],a:0,e:"Kerberos uses tickets from a Key Distribution Center on domain controllers."},
{d:2,t:"malware",ty:"mc",q:"Which malware spreads across a network on its own without user interaction?",o:["Worm","Virus","Trojan","Adware"],a:0,e:"Worms self-replicate; viruses need a user to run an infected file."},
{d:2,t:"malware",ty:"mc",sc:"Files on a shared drive suddenly have new extensions and can't be opened. A text file demands cryptocurrency for a decryption key.",q:"What type of malware is this?",o:["Ransomware","Spyware","Rootkit","Keylogger"],a:0,e:"Ransomware encrypts data and demands payment. Disconnect affected systems and restore from backups."},
{d:2,t:"malware",ty:"mc",q:"Which malware hides deep in the operating system to conceal itself and other malware, often requiring OS reinstallation to remove?",o:["Rootkit","Adware","Worm","PUP"],a:0,e:"Rootkits operate at a low level (kernel) and evade detection."},
{d:2,t:"malware",ty:"mc",q:"Free software a user downloaded secretly opened a backdoor. What type of malware is this?",o:["Trojan","Worm","Ransomware","Boot sector virus"],a:0,e:"A Trojan disguises itself as legitimate software."},
{d:2,t:"malware",ty:"mc",q:"Which malware records everything a user types to steal passwords?",o:["Keylogger","Cryptominer","Adware","Worm"],a:0,e:"Keyloggers capture keystrokes."},
{d:2,t:"social-eng",ty:"mc",sc:"The CFO receives an email that appears to come from the CEO asking for an urgent wire transfer to a new vendor.",q:"This attack is BEST described as:",o:["Whaling / business email compromise","Vishing","Tailgating","Shoulder surfing"],a:0,e:"Whaling targets executives; BEC uses spoofed or compromised executive email to request payments."},
{d:2,t:"social-eng",ty:"mc",q:"An attacker calls a user pretending to be from the help desk and asks for her password. This is:",o:["Vishing","Smishing","Phishing","Spoofing"],a:0,e:"Vishing is voice phishing."},
{d:2,t:"social-eng",ty:"mc",q:"Someone follows an employee through a badge-controlled door without scanning a badge. This is:",o:["Tailgating","Dumpster diving","Shoulder surfing","Impersonation"],a:0,e:"Tailgating (piggybacking) bypasses access control."},
{d:2,t:"social-eng",ty:"mc",q:"An attacker sets up a wireless access point named 'CoffeeShop_Free' next to the real coffee shop network to capture traffic. This is a(n):",o:["Evil twin","DDoS","Zero-day","SQL injection"],a:0,e:"An evil twin imitates a legitimate SSID."},
{d:2,t:"social-eng",ty:"mc",q:"An attacker enters ' OR 1=1 -- into a website's login form to access the database. This is:",o:["SQL injection","Cross-site scripting","Brute force","On-path attack"],a:0,e:"SQL injection inserts malicious SQL through input fields."},
{d:2,t:"social-eng",ty:"mc",q:"Which attack exploits a vulnerability that the vendor doesn't yet know about or hasn't patched?",o:["Zero-day","Dictionary","Insider threat","Tailgating"],a:0,e:"Zero-day attacks occur before a fix exists."},
{d:2,t:"social-eng",ty:"mc",q:"Which control BEST protects against shoulder surfing at a public help desk?",o:["Privacy screen filters","Bollards","Antivirus","Port security"],a:0,e:"Privacy filters narrow the viewing angle of a screen."},
{d:2,t:"social-eng",ty:"mc",q:"An attacker intercepts and possibly alters traffic between two parties. This is a(n):",o:["On-path attack","DoS attack","Brute force attack","Evil twin only"],a:0,e:"On-path (man-in-the-middle) attacks intercept communications."},
{d:2,t:"malware-removal",ty:"order",q:"Put the CompTIA malware removal steps in order.",o:["Investigate and verify malware symptoms","Quarantine the infected system","Disable System Restore in Windows","Remediate: update anti-malware and scan/remove","Schedule scans and run updates","Enable System Restore and create a restore point","Educate the end user"],e:"Investigate, quarantine, disable System Restore, remediate, schedule scans/updates, enable System Restore, educate."},
{d:2,t:"malware-removal",ty:"mc",sc:"A technician has confirmed that a workstation is infected with malware.",q:"What should she do NEXT?",o:["Disconnect the workstation from the network (quarantine)","Disable System Restore","Educate the user","Run a scan with outdated definitions"],a:0,e:"After verifying symptoms, quarantine the system to prevent spread."},
{d:2,t:"malware-removal",ty:"mc",q:"Why does the malware removal process disable System Restore?",o:["To delete restore points that may contain malware","To speed up the scan","To prevent the user from logging in","To update definitions"],a:0,e:"Infected restore points could reintroduce malware; they're removed when System Restore is disabled."},
{d:2,t:"malware-removal",ty:"sa",q:"After removing malware from a user's PC, what are the final two steps of the CompTIA malware removal process?",k:[["system restore","restore point"],["educat","train","teach"]],ans:"Enable System Restore and create a new restore point, then educate the end user about how the infection happened and how to avoid it.",e:"The last steps rebuild a clean restore point and train the user."},
{d:2,t:"win-security",ty:"mc",q:"Which Windows feature encrypts an entire drive and can use the TPM to store keys?",o:["BitLocker","EFS","UAC","Windows Hello"],a:0,e:"BitLocker provides full-volume encryption (Pro and higher)."},
{d:2,t:"win-security",ty:"mc",q:"A user wants to encrypt a USB flash drive with Windows' built-in tools. What should be used?",o:["BitLocker To Go","EFS","FileVault","UAC"],a:0,e:"BitLocker To Go encrypts removable drives."},
{d:2,t:"win-security",ty:"mc",q:"Which Windows feature encrypts individual files and folders tied to a user account on an NTFS volume?",o:["EFS","BitLocker","Defender Firewall","Credential Manager"],a:0,e:"Encrypting File System works at the file/folder level."},
{d:2,t:"win-security",ty:"mc",q:"What is the purpose of User Account Control (UAC)?",o:["Prompt before changes that require administrator rights","Encrypt user files","Synchronize passwords","Block all downloads"],a:0,e:"UAC limits silent elevation by prompting for consent or credentials."},
{d:2,t:"win-security",ty:"mc",q:"Which Windows Defender Firewall profile should be used on a coffee shop Wi-Fi network?",o:["Public","Private","Domain","Guest"],a:0,e:"Public is the most restrictive and hides the PC from other devices."},
{d:2,t:"ntfs-share",ty:"mc",sc:"A user has Full Control share permission and Read NTFS permission on a folder. She accesses it over the network.",q:"What is her effective permission?",o:["Read","Full Control","Modify","No access"],a:0,e:"Over the network, the most restrictive of share and NTFS permissions applies."},
{d:2,t:"ntfs-share",ty:"mc",q:"A user is in two groups: one allows Modify, the other explicitly denies Write on the same folder. What can she do?",o:["She can't write; explicit Deny overrides Allow","She has Modify","She has Full Control","She has no access at all"],a:0,e:"Permissions are cumulative, but an explicit Deny wins."},
{d:2,t:"ntfs-share",ty:"mc",q:"A file is MOVED from one folder to another on the SAME NTFS volume. Which permissions does it have?",o:["It keeps its original permissions","It inherits the destination's permissions","It loses all permissions","It gets Full Control for Everyone"],a:0,e:"Moving within a volume keeps permissions; copying (or moving to another volume) inherits the destination's."},
{d:2,t:"ntfs-share",ty:"mc",q:"What does a $ at the end of a share name (e.g., Finance$) do?",o:["Hides the share from network browsing","Encrypts the share","Makes it read-only","Gives administrators full control"],a:0,e:"Shares ending in $ are hidden; administrative shares such as C$ and ADMIN$ are examples."},
{d:2,t:"active-directory",ty:"mc",q:"In Active Directory, which container organizes users and computers so different Group Policies can be applied to each department?",o:["Organizational unit (OU)","Workgroup","Homegroup","VLAN"],a:0,e:"OUs group objects for administration and Group Policy."},
{d:2,t:"active-directory",ty:"mc",sc:"Users want their Documents folder available from any computer they sign into in the domain, and backed up centrally.",q:"Which feature should be configured?",o:["Folder redirection","EFS","Port forwarding","Fast startup"],a:0,e:"Folder redirection stores user folders on a server share."},
{d:2,t:"active-directory",ty:"mc",q:"A script that maps network drives automatically each time a user signs in to the domain is called a:",o:["Login script","Batch job","Cron job","GPO template"],a:0,e:"Login scripts run at sign-in, often assigned via Group Policy."},
{d:2,t:"mobile-security",ty:"mc",q:"A company phone is stolen. Which feature lets IT erase company data remotely?",o:["Remote wipe","Locator app only","Screen lock","Bluetooth pairing"],a:0,e:"Remote wipe (often through MDM) erases data."},
{d:2,t:"mobile-security",ty:"mc",q:"Which screen lock method is the LEAST secure?",o:["Swipe","PIN","Fingerprint","Facial recognition"],a:0,e:"Swipe offers no authentication."},
{d:2,t:"mobile-security",ty:"mc",sc:"Employees want to use personal phones for work email. The company must protect its data without controlling personal photos and apps.",q:"What is the BEST approach?",o:["BYOD policy with MDM work profiles/containers","Require factory resets weekly","Ban all email on phones","Allow jailbroken phones"],a:0,e:"MDM work profiles separate corporate data from personal data on BYOD devices."},
{d:2,t:"mobile-security",ty:"mc",q:"A phone is configured to erase itself after 10 failed unlock attempts. This is a:",o:["Failed login attempt restriction","Remote backup","Locator setting","Biometric policy"],a:0,e:"Failed login restrictions lock or wipe after too many attempts."},
{d:2,t:"soho-security",ty:"mc",q:"What should be done FIRST when setting up a new SOHO wireless router?",o:["Change the default administrator password","Enable WPS","Enable UPnP","Disable the firewall"],a:0,e:"Default credentials are publicly known; change them first, then update firmware."},
{d:2,t:"soho-security",ty:"mc",q:"Why should WPS be disabled on a SOHO router?",o:["Its PIN method can be brute-forced","It slows down Wi-Fi","It disables WPA3","It prevents DHCP"],a:0,e:"WPS PINs can be cracked relatively quickly."},
{d:2,t:"soho-security",ty:"mc",sc:"A home user hosts a game server on one PC and friends need to reach it on TCP port 25565 from the internet.",q:"What should be configured on the router?",o:["Port forwarding to the PC's IP address","A DMZ for every device","MAC filtering","Disable NAT"],a:0,e:"Port forwarding sends inbound traffic for that port to the internal host (give the host a static IP or reservation)."},
{d:2,t:"soho-security",ty:"mc",q:"A small office wants visitors to have internet access without reaching internal file shares. What should be configured?",o:["A guest network isolated from the internal LAN","Disable SSID broadcast","WPS","A DMZ"],a:0,e:"Guest networks provide internet-only access."},
{d:2,t:"soho-security",ty:"mc",q:"Which SOHO feature lets applications automatically open ports on the router and should be disabled unless needed?",o:["UPnP","DHCP","NAT","QoS"],a:0,e:"UPnP lets devices create port mappings without the administrator's approval."},
{d:2,t:"soho-security",ty:"sa",q:"List four steps to secure a new SOHO wireless router.",k:[["default password","admin password","default credential","change password"],["firmware","update"],["wpa3","wpa2","encryption"],["wps"],["ssid","guest","upnp","filter"]],ans:"Change the default admin username/password, update the firmware, use WPA3 (or WPA2-AES) with a strong passphrase, disable WPS, change the default SSID, disable UPnP if not needed, and set up a guest network.",e:"Any four of these are correct."},
{d:2,t:"browser-security",ty:"mc",q:"Before installing a downloaded tool, how can a technician verify the file wasn't altered?",o:["Compare its hash with the one published by the vendor","Check the file's icon","Run it as administrator","Rename the file"],a:0,e:"Matching hashes (e.g., SHA-256) confirm file integrity."},
{d:2,t:"data-destruction",ty:"mc",q:"Which data destruction method does NOT work on solid-state drives?",o:["Degaussing","Shredding","Incineration","Drilling"],a:0,e:"Degaussing only works on magnetic media; SSDs store data in flash memory."},
{d:2,t:"data-destruction",ty:"mc",sc:"A hospital wants to donate old computers to a school but must ensure patient data is unrecoverable.",q:"What is the BEST method that keeps the drives usable?",o:["Secure erase/overwrite with wiping software","Quick format","Delete the files and empty the Recycle Bin","Degauss the SSDs"],a:0,e:"Overwriting/secure erase removes data while allowing reuse. A quick format doesn't remove data."},
{d:2,t:"data-destruction",ty:"mc",q:"When a company outsources drive destruction to a vendor, what document proves it was done?",o:["Certificate of destruction","EULA","SDS","AUP"],a:0,e:"Vendors provide a certificate of destruction or recycling."},
{d:2,t:"remote-access",ty:"mc",sc:"A user receives a call from 'Microsoft support' saying his PC is infected and asking him to install a remote access tool.",q:"What should he do?",o:["Hang up and report it; it's a scam","Install the tool","Give them his password","Call back the number they provided"],a:0,e:"Unsolicited calls asking to install remote tools are a common scam."},

// ---------- Domain 4: Operational Procedures ----------
{d:4,t:"documentation",ty:"mc",q:"Which document describes step-by-step how to perform a routine task such as installing custom software?",o:["Standard operating procedure (SOP)","Acceptable use policy","Incident report","EULA"],a:0,e:"SOPs document repeatable procedures."},
{d:4,t:"documentation",ty:"mc",q:"Which document defines what employees may and may not do with company computers and networks?",o:["Acceptable use policy (AUP)","Network diagram","SOP","Change request"],a:0,e:"The AUP sets rules for using organizational resources."},
{d:4,t:"documentation",ty:"multi",q:"Which THREE items should be included in a help desk ticket? (Choose three.)",o:["User and device information","Problem description","Resolution details","User's home address","User's salary"],a:[0,1,2],e:"Tickets include user/device info, description, category, severity, notes and resolution."},
{d:4,t:"documentation",ty:"mc",q:"Which database tracks hardware, software and configuration items and their relationships?",o:["CMDB","DNS","SDS","AUP"],a:0,e:"A configuration management database supports asset and change management."},
{d:4,t:"documentation",ty:"mc",q:"An employee is leaving the company. Which checklist ensures accounts are disabled and equipment is returned?",o:["Offboarding checklist","Onboarding checklist","Change request form","Incident report"],a:0,e:"Offboarding checklists cover disabling access and recovering assets."},
{d:4,t:"change-mgmt",ty:"mc",q:"Which part of a change request describes how to return the system to its previous state if the change fails?",o:["Rollback (backout) plan","Scope","Risk level","End-user acceptance"],a:0,e:"A rollback plan restores the original configuration."},
{d:4,t:"change-mgmt",ty:"mc",q:"Who typically reviews and approves significant changes in a change management process?",o:["Change advisory board (CAB)","The end user","The ISP","The vendor's sales team"],a:0,e:"The CAB evaluates risk and approves changes."},
{d:4,t:"change-mgmt",ty:"mc",sc:"An administrator wants to roll out a new antivirus agent to 500 PCs.",q:"According to change management best practices, what should happen BEFORE deployment?",o:["Test the change in a sandbox and get approval","Deploy to everyone at once and monitor","Skip documentation for speed","Let users install it themselves"],a:0,e:"Test in a sandbox, perform risk analysis, document, and get CAB approval."},
{d:4,t:"change-mgmt",ty:"sa",q:"List four items included in a change request form.",k:[["purpose","reason"],["scope"],["date","time","schedul"],["affected","impact","system"],["rollback","backout","risk"]],ans:"Purpose of the change, scope, date and time, affected systems and impact, risk analysis and level, rollback plan, and responsible staff member.",e:"Any four of these are acceptable."},
{d:4,t:"backups",ty:"mc",q:"Which backup type copies only the files that changed since the last FULL backup?",o:["Differential","Incremental","Synthetic","Copy"],a:0,e:"Differential = since the last full; incremental = since the last backup of any type."},
{d:4,t:"backups",ty:"mc",sc:"A full backup runs Sunday and incremental backups run Monday through Friday. The server fails Saturday morning.",q:"What is needed to restore?",o:["Sunday's full backup and every incremental from Monday through Friday","Only Friday's incremental","Sunday's full and Friday's incremental only","Only Sunday's full"],a:0,e:"Incremental restores need the full plus every incremental since, in order."},
{d:4,t:"backups",ty:"mc",q:"Which backup rule calls for three copies of data on two different media types with one copy off-site?",o:["3-2-1","GFS","RAID 5","Synthetic full"],a:0,e:"The 3-2-1 backup rule."},
{d:4,t:"backups",ty:"mc",q:"Which backup rotation scheme uses daily, weekly and monthly backup sets?",o:["Grandfather-father-son","3-2-1","Incremental forever","Mirror"],a:0,e:"GFS rotation: sons (daily), fathers (weekly), grandfathers (monthly)."},
{d:4,t:"backups",ty:"mc",q:"What is the BEST way to confirm backups will work in an emergency?",o:["Perform regular test restores","Check that backup jobs report 'completed'","Use RAID","Store backups next to the server"],a:0,e:"Only a test restore proves the backup is usable."},
{d:4,t:"safety-env",ty:"mc",q:"Where can a technician find handling and disposal instructions for a toner cartridge?",o:["Safety data sheet (SDS)","EULA","AUP","Ticketing system"],a:0,e:"SDS (formerly MSDS) documents hazards, handling and disposal."},
{d:4,t:"safety-env",ty:"mc",q:"Which device provides battery power long enough to shut down servers safely during a blackout?",o:["UPS","Surge suppressor","Power strip","PoE injector"],a:0,e:"An uninterruptible power supply provides battery backup."},
{d:4,t:"safety-env",ty:"mc",q:"Which type of fire extinguisher is appropriate for electrical fires?",o:["Class C (or ABC)","Class A water","Class K","Class D"],a:0,e:"Class C is for energized electrical equipment; never use water."},
{d:4,t:"safety-env",ty:"mc",q:"How should old lithium-ion laptop batteries be disposed of?",o:["Recycled according to local regulations","Thrown in regular trash","Burned","Stored in a drawer indefinitely"],a:0,e:"Batteries contain hazardous materials and must be recycled properly."},
{d:4,t:"safety-env",ty:"mc",q:"A server room has very low humidity. Which risk increases?",o:["Electrostatic discharge","Condensation","Rust","Overheating only"],a:0,e:"Dry air increases static buildup; high humidity causes condensation."},
{d:4,t:"safety-env",ty:"mc",q:"Which is the correct way to lift a heavy printer?",o:["Bend at the knees, keep your back straight, lift with your legs","Bend at the waist and lift quickly","Twist while lifting","Lift with arms extended"],a:0,e:"Use your legs, not your back, and get help with heavy loads."},
{d:4,t:"professionalism",ty:"mc",sc:"A customer is yelling about a printer that has broken three times this month.",q:"What should the technician do?",o:["Stay calm, listen without interrupting, and restate the problem","Argue that it isn't the technician's fault","Tell the customer to calm down","Leave and return later"],a:0,e:"Don't argue or become defensive; listen actively and clarify."},
{d:4,t:"professionalism",ty:"mc",q:"A technician will be 30 minutes late to an on-site appointment. What should she do?",o:["Contact the customer as soon as possible","Arrive late without mentioning it","Cancel the appointment","Send someone else without telling the customer"],a:0,e:"Be punctual; if late, notify the customer."},
{d:4,t:"professionalism",ty:"mc",q:"While repairing an executive's PC, a technician sees a confidential salary spreadsheet open on the screen. What should he do?",o:["Ignore it, not read or discuss it, and continue the repair","Read it to understand the issue","Tell coworkers","Close and delete the file"],a:0,e:"Treat confidential materials with discretion."},
{d:4,t:"professionalism",ty:"mc",q:"Which is an example of setting and meeting customer expectations?",o:["Giving a realistic repair timeline and following up when done","Using technical jargon to sound knowledgeable","Promising same-day fixes for everything","Not providing status updates"],a:0,e:"Provide timelines, options, documentation and follow-up."},
{d:4,t:"privacy-licensing",ty:"mc",q:"Which regulation protects the personal data of people in the European Union?",o:["GDPR","HIPAA","PCI DSS","SOX"],a:0,e:"GDPR is the EU data protection regulation."},
{d:4,t:"privacy-licensing",ty:"mc",sc:"A technician working at a hospital is asked to transfer patient records to a new system.",q:"Which type of regulated data is involved?",o:["PHI","PCI","Open-source","DRM"],a:0,e:"Protected health information (PHI) is regulated in the U.S. by HIPAA."},
{d:4,t:"privacy-licensing",ty:"mc",q:"A technician finds illegal content on a user's computer during a repair. What should she do FIRST?",o:["Stop work, preserve the evidence, and report it through proper channels","Delete the content","Copy it to a flash drive","Confront the user"],a:0,e:"Incident response: identify, report to management/authorities, preserve data/devices, maintain chain of custody."},
{d:4,t:"privacy-licensing",ty:"mc",q:"What is the purpose of a chain of custody form?",o:["Document everyone who handled evidence, when, and why","List software licenses","Track printer toner","Approve changes"],a:0,e:"It preserves the integrity and admissibility of evidence."},
{d:4,t:"privacy-licensing",ty:"mc",q:"A company buys one license for a desktop app and installs it on 20 PCs. What is the issue?",o:["License violation; each installation needs a valid license","Nothing, licenses are per company","It's allowed under open source","It's covered by DRM"],a:0,e:"Installations must match purchased licenses (personal, corporate/volume, etc.)."},
{d:4,t:"remote-access",ty:"mc",q:"A managed service provider monitors and patches hundreds of client PCs from a central console. Which tool is this?",o:["RMM","VNC","Telnet","KVM"],a:0,e:"Remote monitoring and management (RMM) tools are used by MSPs."},
{d:4,t:"remote-access",ty:"mc",q:"Which remote access method creates an encrypted tunnel so a remote worker can reach internal resources as if on the LAN?",o:["VPN","RDP","VNC","SSH only"],a:0,e:"A VPN extends the private network securely over the internet."},
{d:4,t:"scripting",ty:"mc",q:"Which file extension is a PowerShell script?",o:[".ps1",".bat",".sh",".vbs"],a:0,e:".ps1 = PowerShell; .bat = batch; .sh = shell; .vbs = VBScript."},
{d:4,t:"scripting",ty:"mc",q:"Which script type would MOST likely run on a Linux server?",o:[".sh",".bat",".ps1",".vbs"],a:0,e:"Shell scripts (.sh) run in Linux/macOS shells."},
{d:4,t:"scripting",ty:"multi",q:"Which TWO are common use cases for scripting in IT support? (Choose two.)",o:["Remapping network drives at sign-in","Automating backups","Replacing failed hard drives","Applying thermal paste","Recycling batteries"],a:[0,1],e:"Scripts automate tasks such as drive mapping, backups, updates, installs and data gathering."},
{d:4,t:"scripting",ty:"mc",q:"Which is a risk of running a script downloaded from an online forum?",o:["It could introduce malware or change system settings unintentionally","It will always run faster","It disables UAC permanently","It cannot affect the registry"],a:0,e:"Run only reviewed, trusted scripts; test them first."},
{d:4,t:"ai",ty:"mc",sc:"A technician wants to paste a spreadsheet of customer names, addresses and credit card numbers into a public AI chatbot to clean up formatting.",q:"What is the PRIMARY concern?",o:["Exposing sensitive regulated data to a public AI tool","The AI might format it incorrectly","The spreadsheet is too large","AI tools can't read spreadsheets"],a:0,e:"Public AI tools may store or train on inputs. Never paste PII or payment data; follow the AI use policy."},
{d:4,t:"ai",ty:"mc",q:"An AI assistant confidently provides a command that doesn't exist. This is known as:",o:["Hallucination","Bias","Overfitting","Phishing"],a:0,e:"Hallucinations are confident but false outputs; verify AI suggestions before using them."},
{d:4,t:"ai",ty:"sa",q:"Give two limitations or risks of using AI tools in IT support and how to manage them.",k:[["hallucinat","inaccura","wrong","false","incorrect"],["privacy","sensitive","data","confidential","pii"],["verify","review","check","policy","test"]],ans:"AI can hallucinate inaccurate answers or commands, so verify and test output before using it. Public AI tools can expose sensitive data, so follow the organization's AI policy and never paste PII, PHI or credentials. AI can also reflect bias from its training data.",e:"Verify output; protect data; follow policy."}
];

// Additional written short-answer / scenario questions (both exams)
const QSA = [
{ex:1,d:2,t:"ip-addressing",ty:"sa",sc:"A user's PC shows the IP address 169.254.12.7 and can't reach the internet. Other users are fine.",q:"Explain what this address means and two things you would check.",k:[["apipa","169.254","self-assign","automatic private"],["dhcp"],["cable","link","port","switch","nic","adapter","wifi","wireless"],["ipconfig","renew","release"]],ans:"169.254.x.x is an APIPA address the PC assigned itself because it couldn't get a lease from a DHCP server. Check the physical connection (cable, link light, switch port, Wi-Fi connection) and adapter, then run ipconfig /release and ipconfig /renew. If several users are affected, check the DHCP server or its scope.",e:"APIPA = no DHCP response."},
{ex:1,d:2,t:"ports-protocols",ty:"sa",q:"Why should SSH be used instead of Telnet, and which ports does each use?",k:[["encrypt","secure","plain text","cleartext","unencrypted"],["22"],["23"]],ans:"Telnet sends everything, including passwords, in plain text, while SSH encrypts the session. SSH uses TCP 22; Telnet uses TCP 23.",e:"Encryption is the key difference."},
{ex:1,d:2,t:"wireless",ty:"sa",q:"Compare the 2.4 GHz and 5 GHz Wi-Fi bands.",k:[["2.4"],["range","distance","farther","walls","penetrat"],["5"],["faster","speed","throughput","more channels","less interference","interference"]],ans:"2.4 GHz has longer range and better wall penetration but more interference and only three non-overlapping channels (1, 6, 11). 5 GHz is faster, has more channels and less interference, but shorter range.",e:"Range vs speed tradeoff."},
{ex:1,d:2,t:"net-hardware",ty:"sa",q:"What is the difference between a switch and a router?",k:[["switch"],["mac","same network","lan","local"],["router"],["ip","between networks","different networks","network to network","internet"]],ans:"A switch connects devices within the same LAN and forwards frames using MAC addresses. A router connects different networks and forwards packets using IP addresses, for example between a LAN and the internet.",e:"Layer 2 vs layer 3."},
{ex:1,d:3,t:"storage-types",ty:"sa",sc:"A customer asks whether to buy a SATA SSD or an NVMe SSD for an older desktop with no M.2 slot.",q:"What would you recommend and why?",k:[["sata"],["nvme"],["m.2","pcie","slot","adapter"]],ans:"Without an M.2 slot, a 2.5-in SATA SSD is the simple choice and is still far faster than an HDD. NVMe drives need an M.2 slot with PCIe support, or a PCIe adapter card, and the system must be able to boot from it.",e:"Interface compatibility first."},
{ex:1,d:3,t:"bios-uefi",ty:"sa",q:"Explain what TPM and Secure Boot each do.",k:[["tpm","trusted platform"],["key","encrypt","bitlocker","crypt"],["secure boot"],["sign","boot loader","bootloader","malware","trusted"]],ans:"The TPM is a hardware or firmware chip that securely stores cryptographic keys (used by BitLocker) and measures boot integrity. Secure Boot is a UEFI feature that allows only digitally signed, trusted boot loaders to run, blocking boot-level malware.",e:"Both are required for Windows 11."},
{ex:1,d:3,t:"psu",ty:"sa",q:"What should you consider when choosing a replacement power supply?",k:[["watt"],["form factor","atx","size"],["connector","pcie","24-pin","cable","sata"],["efficien","80 plus"]],ans:"Wattage with headroom for all components, the correct form factor for the case, the needed connectors (24-pin, CPU, PCIe, SATA), efficiency rating (80 Plus), and input voltage (auto-switching).",e:"Watts, form factor, connectors, efficiency."},
{ex:1,d:4,t:"virtualization",ty:"sa",q:"Explain the difference between a Type 1 and a Type 2 hypervisor and give an example use for each.",k:[["type 1","bare metal","bare-metal"],["hardware","directly"],["type 2","hosted"],["operating system","os","host"]],ans:"A Type 1 (bare-metal) hypervisor runs directly on the hardware and is used for servers in data centers. A Type 2 (hosted) hypervisor runs as an application on a host OS and is used on desktops for testing, sandboxing, or running another OS.",e:"Where the hypervisor runs."},
{ex:1,d:5,t:"troubleshoot-method",ty:"sa",q:"List the six steps of the CompTIA troubleshooting methodology.",k:[["identify"],["theory"],["test"],["plan"],["verify"],["document"]],ans:"1) Identify the problem, 2) Establish a theory of probable cause, 3) Test the theory, 4) Establish a plan of action and implement the solution, 5) Verify full system functionality and implement preventive measures, 6) Document findings, actions and outcomes.",e:"Memorize the order."},
{ex:1,d:5,t:"net-troubleshoot",ty:"sa",sc:"Users on one floor complain the Wi-Fi is slow at lunch and drops when the break-room microwave runs.",q:"What is the likely cause and how would you fix it?",k:[["interference","microwave"],["2.4"],["5","channel","move","relocat","analyzer"]],ans:"The microwave interferes with the 2.4 GHz band. Use a Wi-Fi analyzer, move the AP away from the microwave, change channels, or have clients use 5 GHz/6 GHz.",e:"Identify interference, change band or location."},
{ex:1,d:5,t:"printer-troubleshoot",ty:"sa",q:"Toner smears and wipes off pages from a laser printer. Which part has failed and what does it do?",k:[["fuser"],["heat","melt","pressure","bond"]],ans:"The fuser assembly has failed. It uses heat and pressure to melt and bond toner to the paper.",e:"Unfused toner = fuser."},
{ex:2,d:1,t:"partitions-fs",ty:"sa",q:"Compare NTFS, FAT32 and exFAT.",k:[["ntfs"],["permission","security","encrypt","journal"],["fat32"],["4 gb","4gb"],["exfat"],["large","removable","flash","mac","cross"]],ans:"NTFS is the Windows file system with permissions, encryption, compression and journaling. FAT32 is widely compatible but limits files to 4 GB. exFAT supports large files and is used on removable drives shared between Windows and macOS.",e:"Know the use case for each."},
{ex:2,d:1,t:"windows-tools",ty:"sa",q:"Name the MMC tool (and its .msc command) you would use to (1) partition a new disk, (2) review error logs, and (3) roll back a driver.",k:[["disk management","diskmgmt"],["event viewer","eventvwr"],["device manager","devmgmt"]],ans:"(1) Disk Management – diskmgmt.msc, (2) Event Viewer – eventvwr.msc, (3) Device Manager – devmgmt.msc.",e:"Know tool names and commands."},
{ex:2,d:1,t:"install-methods",ty:"sa",q:"What is the difference between a clean install and an in-place upgrade?",k:[["clean"],["erase","wipe","fresh","format","remove"],["upgrade","in-place"],["keep","retain","preserv"]],ans:"A clean install erases the existing partition and installs a fresh OS, so apps and data must be restored afterward. An in-place upgrade installs the new version over the old one and keeps apps, settings and files.",e:"Fresh vs keeping data."},
{ex:2,d:2,t:"ntfs-share",ty:"sa",sc:"A user has Change share permission and Read NTFS permission on \\\\fs1\\projects. He says he can't save files there.",q:"Explain why and what you would change.",k:[["most restrictive","more restrictive","restrictive"],["read"],["ntfs","modify","write"]],ans:"When accessing over the network, the most restrictive of share and NTFS permissions applies, so his effective permission is Read. Grant him (preferably through a group) Modify or Write NTFS permission on the folder.",e:"Combine share + NTFS, take the most restrictive."},
{ex:2,d:2,t:"social-eng",ty:"sa",q:"Define phishing, vishing and smishing.",k:[["phishing","email"],["vishing","voice","phone","call"],["smishing","sms","text"]],ans:"Phishing uses fraudulent emails to trick users into revealing information or clicking malicious links. Vishing does the same over voice/phone calls. Smishing uses SMS text messages.",e:"Channel defines the name."},
{ex:2,d:2,t:"malware-removal",ty:"sa",q:"List the seven malware removal steps in order.",k:[["investigat","verify","symptom"],["quarantin"],["disable"],["remediat","update","scan"],["schedule"],["enable","restore point"],["educat"]],ans:"1) Investigate and verify symptoms, 2) Quarantine the system, 3) Disable System Restore, 4) Remediate (update anti-malware, scan and remove using Safe Mode or a preinstallation environment), 5) Schedule scans and run updates, 6) Enable System Restore and create a restore point, 7) Educate the end user.",e:"Memorize the order."},
{ex:2,d:2,t:"auth",ty:"sa",q:"Explain multifactor authentication and give an example using two different factors.",k:[["two","more than one","multiple","different"],["know","password","pin"],["have","token","phone","app","card","are","fingerprint","biometric","face"]],ans:"MFA requires two or more different types of factors: something you know, have, are, or somewhere you are. Example: a password (know) plus a code from an authenticator app on your phone (have).",e:"Different factor types, not two passwords."},
{ex:2,d:3,t:"startup-troubleshoot",ty:"sa",sc:"After a Windows update, a PC restarts into a stop error and never reaches the desktop.",q:"Describe how you would get it working again.",k:[["winre","recovery","advanced startup","shift"],["safe mode"],["uninstall","roll back","system restore","rollback"]],ans:"Let Windows enter the Recovery Environment (or force it after failed boots), then use Uninstall Updates or System Restore, or boot into Safe Mode to remove the update or driver. If those fail, use Startup Repair, and as a last resort Reset this PC.",e:"WinRE → undo the change."},
{ex:2,d:3,t:"sw-troubleshoot",ty:"sa",q:"What does System Restore change, and what does it NOT change?",k:[["system file","registry","driver","program","app","setting"],["personal","document","user file","data","photo"]],ans:"System Restore rolls back system files, the registry, drivers, and installed programs to a restore point. It doesn't change or recover personal files such as documents and photos.",e:"Not a backup of user data."},
{ex:2,d:4,t:"backups",ty:"sa",q:"Explain the difference between incremental and differential backups, including what is needed to restore.",k:[["incremental"],["since the last backup","last backup","any backup"],["differential"],["since the last full","last full"],["restore","each incremental","all incremental","latest differential","full plus","full and"]],ans:"An incremental backup copies changes since the last backup of any type; restoring needs the last full plus every incremental since. A differential copies changes since the last full; restoring needs the last full plus the most recent differential.",e:"Faster backup vs faster restore."},
{ex:2,d:4,t:"professionalism",ty:"sa",sc:"You're on-site to fix a user's laptop. The user is frustrated and keeps interrupting.",q:"Describe three professional behaviors you would use.",k:[["listen"],["calm","patient","don't argue","not argue","defensive","positive"],["jargon","clear","explain","expectation","timeline","follow"]],ans:"Actively listen without interrupting, stay calm and don't argue or become defensive, restate the problem to clarify, avoid jargon, set clear expectations for the repair timeline, and follow up afterward.",e:"Any three professional behaviors."},
{ex:2,d:4,t:"safety-env",ty:"sa",q:"What is the difference between a surge suppressor and a UPS?",k:[["surge"],["spike","surge"],["ups","uninterruptible"],["battery","blackout","outage","shut down"]],ans:"A surge suppressor protects equipment from voltage spikes but provides no power during an outage. A UPS has a battery that keeps equipment running during blackouts and brownouts long enough to shut down properly; most also include surge protection.",e:"Spikes vs outages."},
{ex:2,d:1,t:"linux",ty:"sa",q:"What do the chmod permissions 644 mean on a Linux file?",k:[["owner","user"],["read"],["write"],["group","other","everyone"]],ans:"6 = read + write for the owner; 4 = read only for the group; 4 = read only for others (rw-r--r--).",e:"r=4, w=2, x=1."}

// Original diagrams and error-screen recreations drawn for this app (inline SVG, theme-aware)
const WIRE = {wo:["#ffffff","#f08a24"],o:["#f08a24"],wg:["#ffffff","#2e9c4a"],g:["#2e9c4a"],wb:["#ffffff","#2f6fd6"],b:["#2f6fd6"],wbr:["#ffffff","#8a5a2b"],br:["#8a5a2b"]};
function wireSVG(order, label, x0){
  const names = {wo:"White/orange",o:"Orange",wg:"White/green",g:"Green",wb:"White/blue",b:"Blue",wbr:"White/brown",br:"Brown"};
  let s = `<text x="${x0+70}" y="20" class="dt" text-anchor="middle" font-weight="700">${label}</text>`;
  order.forEach((w,i) => {
    const y = 34 + i*26, c = WIRE[w];
    s += `<text x="${x0}" y="${y+13}" class="dm mono" font-size="11">${i+1}</text>`;
    s += `<rect x="${x0+14}" y="${y}" width="44" height="18" rx="3" fill="${c[0]}" stroke="#888" stroke-width="1"/>`;
    if (c[1]) s += `<rect x="${x0+14}" y="${y+6}" width="44" height="6" fill="${c[1]}"/>`;
    s += `<text x="${x0+66}" y="${y+13}" class="dt" font-size="12">${names[w]}</text>`;
  });
  return s;
}

<script>
(function(){
"use strict";
// ---------- data assembly ----------
const KB = [...KB1, ...KB2];
const KBMAP = Object.fromEntries(KB.map(k => [k.id, k]));
const MODMAP = Object.fromEntries(MODULES.map(m => [String(m.n), m]));
const QS = [];
[[Q1A,"1a",1],[Q1B,"1b",1],[Q2A,"2a",2],[Q2B,"2b",2],[QSA,"sa",null]].forEach(([arr,p,ex]) => {
  arr.forEach((q,i) => { const o = Object.assign({}, q); o.id = p+"-"+i; o.ex = q.ex || ex; o.m = KBMAP[q.t].m; QS.push(o); });
});
const QMAP = Object.fromEntries(QS.map(q => [q.id, q]));
// ---------- Professor Messer videos ----------
const STANDALONE = !!window.__APLUS_STANDALONE__;
const VMAP = Object.fromEntries(VIDEOS.map(v => [v[0], {id:v[0], ex:v[1], obj:v[2], title:v[3], len:v[4], yt: YT_IDS[v[0]] || "", url: v[5].startsWith("http") ? v[5] : PM_BASE[v[1]] + v[5] + "/"}]));
const VID_TOPICS = {}; Object.entries(TOPIC_VIDEOS).forEach(([t, ids]) => ids.forEach(id => (VID_TOPICS[id] = VID_TOPICS[id] || []).push(t)));
const PM_PLAYLIST1 = "https://www.youtube.com/playlist?list=PLG49S3nxzAnnes8ZGI-OBlKEukHCX46N8";
const PM_CHANNEL = "https://www.youtube.com/@professormesser";
const ytSearch = q => "https://www.youtube.com/@professormesser/search?query=" + encodeURIComponent(q);
const TYPE_LABEL = {mc:"Multiple choice", multi:"Multiple response", order:"Ordering (PBQ-style)", sa:"Written short answer"};

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip = h => String(h).replace(/<[^>]+>/g, " ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/\s+/g," ").trim();
const norm = s => String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/[“”]/g,'"');
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const modLabel = m => { const md = MODMAP[String(m)]; return md ? (typeof m === "number" ? "Module "+m : "Appendix "+m) : ""; };
const modTitle = m => (MODMAP[String(m)]||{}).t || "";
const domName = (ex,d) => ((DOMAINS[ex]||[]).find(x=>x.d===d)||{}).t || "";
const pct = (a,b) => b ? Math.round(100*a/b) : 0;
const KEYS = "ABCDEFGH";

// ---------- install as an app (website version) ----------
let installEvt = null;
const IS_INSTALLED = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; const b = document.getElementById("installbtn"); if (b) b.hidden = false; });
window.addEventListener("appinstalled", () => { installEvt = null; const b = document.getElementById("installbtn"); if (b) b.remove(); });

// ---------- storage (per-viewer, best effort) ----------
const STORE = "aplus-bench-v1";
let S = {att:{}, flag:{}, exams:[], watched:{}};
try { const raw = localStorage.getItem(STORE); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
if (!S.watched) S.watched = {};
function save(){ try { localStorage.setItem(STORE, JSON.stringify(S)); } catch(e) {} }
function record(qid, ok){ const a = S.att[qid] || {c:0,w:0}; ok ? a.c++ : a.w++; a.last = ok ? 1 : 0; a.t = Date.now(); S.att[qid] = a; save(); }

// ---------- AI tutor (optional runtime capability) ----------
let sampleFn = null;
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("sample").then(f => { sampleFn = f || null; document.body.classList.toggle("has-ai", !!sampleFn); }).catch(()=>{});
}
function aiErr(e){
  const c = e && e.code;
  if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)) { sampleFn = null; document.body.classList.remove("has-ai"); return "The tutor isn't available in this view. Use the study notes and search instead."; }
  if (c === "rate_limited") return "Too many tutor requests right now. Wait a minute and try again.";
  if (c === "session_expired") return "Your Claude session expired. Sign in again to use the tutor.";
  if (c === "refused") return "The tutor couldn't answer that. Try rephrasing the question.";
  return "The tutor couldn't respond. Try again.";
}
const MOD_LIST = MODULES.map(m => (typeof m.n==="number"?"Module ":"Appendix ")+m.n+": "+m.t).join("; ");
let tutorCtl = null;
async function runTutor(prompt, outEl, stopBtn){
  if (!sampleFn) return;
  if (tutorCtl) tutorCtl.abort();
  const ctl = new AbortController(); tutorCtl = ctl;
  outEl.textContent = "Thinking…";
  if (stopBtn) { stopBtn.hidden = false; stopBtn.onclick = () => ctl.abort(); }
  try {
    const r = await sampleFn(prompt, {signal: ctl.signal, onText: ({text}) => { outEl.textContent = text; }});
    if (r.truncated) outEl.textContent += "\n\n(Answer cut short. Ask a narrower question.)";
  } catch(e) {
    if (e && e.code === "cancelled") outEl.textContent = e.text || "Stopped.";
    else outEl.textContent = (e && e.text ? e.text + "\n\n" : "") + aiErr(e);
  } finally { if (stopBtn) stopBtn.hidden = true; if (tutorCtl === ctl) tutorCtl = null; }
}
function tutorPrompt(question, articles, extra){
  const ctx = articles.slice(0,4).map(a => "["+modLabel(a.m)+": "+modTitle(a.m)+"] "+a.title+"\n"+strip(a.body)).join("\n\n");
  return "You are a patient CompTIA A+ tutor helping a beginner prepare for exams 220-1201 (Core 1) and 220-1202 (Core 2). "
   + "The student studies from the textbook \"CompTIA A+ Guide to IT Technical Support, 12th Edition\" (Andrews, Shelton, Schmelz, Jaqua Jr., Cengage). Its modules are: " + MOD_LIST + ".\n\n"
   + "Answer in plain text under 250 words: short paragraphs or lines starting with \"- \", no markdown headings or bold. Explain the why, use an everyday example, and point out what the exam tends to test. "
   + "Finish with one line in the form \"Where to read: Module N – Title\" naming the most relevant module(s) from the list above. Never invent page numbers. If the question is not about IT or the A+ exams, say so briefly.\n\n"
   + (ctx ? "Study notes from this app (use as your main reference):\n" + ctx + "\n\n" : "")
   + (extra ? extra + "\n\n" : "")
   + "Student's question: " + question;
}

// ---------- search ----------
const STOP = new Set("the a an and or of to in on for is are what which how does do with by be it this that from at as when why who can i my".split(" "));
const KBTEXT = KB.map(k => ({k, title:norm(k.title), kw:norm(k.kw), body:norm(strip(k.body))}));
function tokens(q){ return norm(q).split(/[^a-z0-9.+#$\-]+/).map(t=>t.replace(/^[.\-]+|[.\-]+$/g,"")).filter(t => t && !STOP.has(t) && (t.length>1 || /\d/.test(t))); }
function has(hay, t){ if (t.length <= 3) return new RegExp("(^|[^a-z0-9])"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"($|[^a-z0-9])").test(hay); return hay.includes(t); }
function search(q){
  const tk = tokens(q); const phrase = norm(q).trim();
  if (!tk.length) return {kb:[], gl:[], qs:[], tk, vids:[]};
  const need = Math.max(1, Math.ceil(tk.length*0.6));
  const kb = KBTEXT.map(x => {
    let s=0, hit=0;
    tk.forEach(t => { let h=0; if (has(x.title,t)) {s+=6;h=1} if (has(x.kw,t)) {s+=4;h=1} if (has(x.body,t)) {s+=2;h=1} hit+=h; });
    if (phrase.length>3 && x.body.includes(phrase)) s+=8;
    if (phrase.length>3 && x.title.includes(phrase)) s+=10;
    return {k:x.k, s, hit};
  }).filter(r => r.hit>=need && r.s>0).sort((a,b)=>b.s-a.s).slice(0,8);
  const vids = VIDEOS.map(x => VMAP[x[0]]).map(vv => {
      const title = norm(vv.title), topics = norm((VID_TOPICS[vv.id]||[]).map(t=>KBMAP[t]?KBMAP[t].title:"").join(" "));
      const hit = tk.filter(t => has(title,t) || has(topics,t)).length;
      return {vv, hit, s: tk.filter(t=>has(title,t)).length*2 + hit};
    }).filter(x => x.hit >= need).sort((a,b)=>b.s-a.s).slice(0,6).map(x=>x.vv);
  const gl = GLOSSARY.filter(([a,m]) => tk.some(t => norm(a)===t || norm(a).replace(/[.+]/g,"")===t.replace(/[.+]/g,"")) || (phrase.length>3 && norm(m).includes(phrase))).slice(0,8);
  const qs = QS.map(q => {
    const hay = norm(q.q+" "+(q.sc||"")+" "+(q.o||[]).join(" ")+" "+q.e+" "+(q.ans||""));
    let hit=0; tk.forEach(t => { if (has(hay,t)) hit++; });
    return {q, hit};
  }).filter(r => r.hit>=need).sort((a,b)=>b.hit-a.hit).slice(0,10);
  return {kb, gl, qs, tk, vids};
}
function snippet(text, tk){
  const t = norm(text); let at = -1;
  for (const w of tk) { const i = t.indexOf(w); if (i>=0 && (at<0 || i<at)) at = i; }
  let s = at<0 ? text.slice(0,180) : text.slice(Math.max(0,at-70), at+150);
  if (at>70) s = "…"+s; s = esc(s)+"…";
  tk.filter(w=>w.length>2).forEach(w => { s = s.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"), "<mark>$1</mark>"); });
  return s;
}

// ---------- short-answer grading ----------
function gradeSA(q, text){
  const t = norm(text);
  const hits = q.k.map(g => g.some(w => has(t, norm(w))));
  const n = hits.filter(Boolean).length;
  const score = n/q.k.length;
  return {hits, score, pass: score >= 0.6, words: t.split(/\s+/).filter(Boolean).length};
}
const conceptName = g => g[0];

// ---------- session ----------
let P = null;      // active practice/exam session
let timerInt = null;
let route = "home";

function newSession(ids, mode, opts){
  const qs = ids.map(id => QMAP[id]);
  const view = {};
  qs.forEach(q => {
    if (q.ty==="mc"||q.ty==="multi") view[q.id] = shuffle(q.o.map((_,i)=>i));
    if (q.ty==="order") { let s = shuffle(q.o.map((_,i)=>i)); if (s.every((v,i)=>v===i)) s = s.slice().reverse(); view[q.id] = s; }
  });
  P = Object.assign({ids, mode, i:0, resp:{}, done:{}, ok:{}, view, flags:{}, start:Date.now()}, opts||{});
  // ordering questions start with their shuffled arrangement as the response
  qs.forEach(q => { if (q.ty==="order") P.resp[q.id] = view[q.id].slice(); });
}

function isCorrect(q, r){
  if (r == null) return false;
  if (q.ty==="mc") return r === q.a;
  if (q.ty==="multi") { const a = q.a.slice().sort().join(); return Array.isArray(r) && r.slice().sort().join() === a; }
  if (q.ty==="order") return Array.isArray(r) && r.every((v,i)=>v===i);
  if (q.ty==="sa") return gradeSA(q, r).pass;
  return false;
}
function answered(q, r){
  if (q.ty==="mc") return typeof r === "number";
  if (q.ty==="multi") return Array.isArray(r) && r.length>0;
  if (q.ty==="order") return true;
  if (q.ty==="sa") return typeof r === "string" && r.trim().length>0;
}

// ---------- pickers ----------
function pickPractice(cfg){
  let pool = QS.filter(q => cfg.exams.includes(q.ex) && cfg.types.includes(q.ty));
  if (cfg.domains && cfg.domains.length) pool = pool.filter(q => cfg.domains.includes(q.ex+"-"+q.d));
  if (cfg.module) pool = pool.filter(q => String(q.m) === String(cfg.module));
  if (cfg.topic) pool = pool.filter(q => q.t === cfg.topic);
  if (cfg.focus === "missed") pool = pool.filter(q => S.att[q.id] && S.att[q.id].last === 0);
  if (cfg.focus === "new") pool = pool.filter(q => !S.att[q.id]);
  if (cfg.focus === "flagged") pool = pool.filter(q => S.flag[q.id]);
  pool = shuffle(pool);
  return pool.slice(0, cfg.count === "all" ? pool.length : +cfg.count).map(q => q.id);
}
function pickExam(ex, n){
  const doms = DOMAINS[ex];
  const ids = [];
  const quota = doms.map(d => Math.round(n * d.w/100));
  let diff = n - quota.reduce((a,b)=>a+b,0); quota[quota.length-1] += diff;
  doms.forEach((d,i) => {
    const pool = shuffle(QS.filter(q => q.ex===ex && q.d===d.d && q.ty!=="sa"));
    ids.push(...pool.slice(0, quota[i]).map(q=>q.id));
  });
  // top up if a domain ran short
  if (ids.length < n) { const extra = shuffle(QS.filter(q => q.ex===ex && q.ty!=="sa" && !ids.includes(q.id))); ids.push(...extra.slice(0, n-ids.length).map(q=>q.id)); }
  // CompTIA places performance-based items first
  const pbq = ids.filter(id => QMAP[id].ty==="order"), rest = shuffle(ids.filter(id => QMAP[id].ty!=="order"));
  return [...pbq, ...rest];
}

// ---------- stats ----------
function domainStats(ex){
  return DOMAINS[ex].map(d => {
    const qs = QS.filter(q => q.ex===ex && q.d===d.d);
    const seen = qs.filter(q => S.att[q.id]);
    const right = seen.filter(q => S.att[q.id].last===1).length;
    return {d, total:qs.length, seen:seen.length, right, acc: seen.length ? right/seen.length : null};
  });
}

// ---------- render: nav ----------
function setNav(){ document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-current", b.dataset.go===route ? "page" : "false")); }
function go(r, arg){
  if (P && P.mode==="exam" && !P.finished && r!=="exam-run" && r!=="exam") {
    if (!confirmLeave()) return;
  }
  route = r.split("-")[0] === "exam" ? "exam" : (r.split("-")[0] === "practice" ? "practice" : r);
  setNav();
  if (r!=="exam-run") stopTimer();
  const fn = VIEWS[r]; $("#view").innerHTML = ""; fn(arg);
  window.scrollTo({top:0});
}
function confirmLeave(){ toast("Finish or end the exam first (use End exam)."); return false; }

// ---------- toast ----------
function toast(msg){
  let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id="toast"; t.style.cssText="position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:.9rem;max-width:90vw"; document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(()=>{t.hidden=true}, 2600);
}

      let cls = "opt" + (isSel?" sel":"");
      if (reveal) { cls += " locked"; if (correct.includes(oi)) cls += " right"; else if (isSel) cls += " wrong"; }
      return `<label class="${cls}"><input type="${q.ty==="mc"?"radio":"checkbox"}" name="opt" value="${oi}" ${isSel?"checked":""} ${reveal?"disabled":""}><span class="key">${KEYS[pos]}</span><span>${esc(q.o[oi])}</span></label>`;
    }).join("") + `</div>`;
  } else if (q.ty==="order") {
    const arr = r;
    body = `<p class="muted" style="font-size:.9rem">Use the arrow buttons to put the items in the correct order, top to bottom.</p><ul class="order">` + arr.map((oi,pos) => {
      let cls = reveal ? (oi===pos ? "right" : "wrong") : "";
      return `<li class="${cls}"><span>${esc(q.o[oi])}</span>${reveal?"":`<span class="mv"><button type="button" data-act="up" data-pos="${pos}" aria-label="Move up" ${pos===0?"disabled":""}>↑</button><button type="button" data-act="down" data-pos="${pos}" aria-label="Move down" ${pos===arr.length-1?"disabled":""}>↓</button></span>`}</li>`;
    }).join("") + `</ul>`;
  } else if (q.ty==="sa") {
    body = `<label class="eyebrow" for="sa">Your answer</label><textarea id="sa" ${reveal?"readonly":""} placeholder="Write your answer in your own words…">${esc(r||"")}</textarea>`;
  }
  return `<article class="qcard">
    <div class="qhead">${tags}${P.mode==="exam"?`<button class="btn small flagbtn" data-act="flag" aria-pressed="${!!P.flags[q.id]}">${P.flags[q.id]?"Flagged":"Flag for review"}</button>`:`<button class="btn small flagbtn" data-act="sflag" aria-pressed="${!!S.flag[q.id]}">${S.flag[q.id]?"Flagged":"Flag"}</button>`}</div>
    ${q.sc ? `<div class="scenario"><span class="eyebrow">Scenario</span>${esc(q.sc)}</div>` : ""}
    <p class="stem">${esc(q.q)}${q.ty==="multi"?` <span class="muted" style="font-size:.9rem">(Select ${q.a.length}.)</span>`:""}</p>
    ${body}
    <div id="fb"></div>
  </article>`;
}
function feedbackHTML(q){
  const r = P.resp[q.id];
  if (q.ty==="sa") {
    const g = gradeSA(q, r||"");
    const cls = g.pass ? "ok" : (g.score>0 ? "part" : "no");
    return `<div class="feedback ${cls}">
      <h3>${g.pass?"Good answer":(g.score>0?"Partly there":"Not yet")} <span class="tag">${Math.round(g.score*100)}% of key ideas</span></h3>
      <div><span class="eyebrow">Key ideas checked</span><div class="concepts" style="margin-top:6px">${q.k.map((grp,i)=>`<span class="tag ${g.hits[i]?"good":"bad"}">${g.hits[i]?"✓":"✗"} ${esc(conceptName(grp))}</span>`).join("")}</div></div>
      <div><span class="eyebrow">Model answer</span><div class="model" style="margin-top:6px">${esc(q.ans)}</div></div>
      <p>${esc(q.e)}</p>
      <p class="note">The quick check looks for key terms, so a correct answer in different words can score low. Compare with the model answer${sampleFn?", or ask the tutor to grade it":""}.</p>
      <div class="ai-only"><div class="row"><button class="btn small teal" data-act="aigrade">Grade my answer with the tutor</button></div></div>
      <div class="tutor" id="aigrade" hidden><span class="eyebrow">Tutor feedback</span><div class="out"></div></div>
      ${bookRefHTML(q)}
      ${tutorBox(q)}

  }
  const ok = isCorrect(q, r);
  let right = "";
  if (q.ty==="mc") right = `Correct answer: ${esc(q.o[q.a])}`;
  if (q.ty==="multi") right = `Correct answers: ${q.a.map(i=>esc(q.o[i])).join("; ")}`;
  if (q.ty==="order") right = `Correct order: ${q.o.map((o,i)=>(i+1)+". "+esc(o)).join("  ")}`;
  return `<div class="feedback ${ok?"ok":"no"}">
    <h3>${ok?"Correct":"Incorrect"}</h3>
    ${ok?"":`<p><b>${right}</b></p>`}
    <p>${esc(q.e)}</p>

  </div>`;
}
function tutorBox(q){

    <div class="row"><input type="text" id="tq" placeholder="e.g., Why isn't the other option right?" style="flex:1;min-width:180px"><button class="btn small teal" data-act="tutorq">Ask</button><button class="btn small" data-act="stop" hidden id="tstop">Stop</button></div>
