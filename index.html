<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<script>window.__APLUS_STANDALONE__=true;</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16325e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A+ Study">
<script>if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
<title>A+ Study Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: app shell — sticky top bar with tab nav, single centered work column (max 980px), cards only for the active question and tools */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --sunk:#e8ecf2; --ink:#101c30; --muted:#566379; --line:#d6dce6;
  --navy:#16325e; --teal:#14897c; --amber:#b86d0e; --good:#1b7f4c; --bad:#b63434;
  --good-bg:#e4f4ea; --bad-bg:#f9e6e6; --amber-bg:#fbefdc; --teal-bg:#e0f2ef; --focus:#2f6fd6;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1322; --surface:#121c2f; --sunk:#0e1728; --ink:#e4eaf3; --muted:#93a1b7; --line:#24324b;
  --navy:#9dbcf2; --teal:#43c3b2; --amber:#efa448; --good:#4cc488; --bad:#f07575;
  --good-bg:#12301f; --bad-bg:#371a1d; --amber-bg:#33250f; --teal-bg:#0f2d2a; --focus:#7aa7ff; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0b1322; --surface:#121c2f; --sunk:#0e1728; --ink:#e4eaf3; --muted:#93a1b7; --line:#24324b;
  --navy:#9dbcf2; --teal:#43c3b2; --amber:#efa448; --good:#4cc488; --bad:#f07575;
  --good-bg:#12301f; --bad-bg:#371a1d; --amber-bg:#33250f; --teal-bg:#0f2d2a; --focus:#7aa7ff; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:18px;min-height:56px}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:var(--navy)}
.brand span{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;padding:16px 12px 14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--teal)}
.nav button:hover{color:var(--ink)}
.timer{font-family:var(--f-mono);font-weight:600;padding:4px 10px;border-radius:6px;background:var(--amber-bg);color:var(--amber);white-space:nowrap}
@media (max-width:640px){.brand span{display:none}.top-in{gap:8px;flex-wrap:wrap}.nav{order:3;flex-basis:100%}.nav button{padding:10px 10px 9px}}
main{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:grid;gap:28px}
/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--surface)}
:root[data-theme="dark"] .btn.primary{color:#0b1322}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0b1322}}
.btn.teal{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.btn.ghost{border-color:transparent;background:none;color:var(--navy)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.72rem;padding:3px 8px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.teal{background:var(--teal-bg);color:var(--teal)}
.tag.amber{background:var(--amber-bg);color:var(--amber)}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.grid2>*{min-width:0}
/* dashboard */
.hero{display:grid;gap:10px}
.hero p{max-width:62ch;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.facts div{padding:14px 16px;border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts b{display:block;font-family:var(--f-mono);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.facts span{font-size:.82rem;color:var(--muted)}
.dom{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.dom:first-of-type{border-top:0}
.dom .name{font-weight:500;min-width:0}
.dom .name small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:.72rem}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--teal);border-radius:4px}
.bar.weak i{background:var(--amber)}
.pct{font-family:var(--f-mono);font-size:.85rem;text-align:right;font-variant-numeric:tabular-nums}
.examlist{display:grid;gap:6px;font-size:.9rem}
.examlist div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
/* setup form */
fieldset{border:0;padding:0;margin:0;display:grid;gap:10px}
legend{font-weight:600;margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--surface);font-size:.9rem}
.chip input:checked+span{background:var(--navy);border-color:var(--navy);color:var(--surface)}
:root[data-theme="dark"] .chip input:checked+span{color:#0b1322}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip input:checked+span{color:#0b1322}}
.chip input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
select,input[type=search],input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
textarea{min-height:130px;resize:vertical;line-height:1.5}
.setup{display:grid;gap:22px}
/* question */
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.qprog{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--teal)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:grid;gap:18px}
.scenario{border-left:3px solid var(--amber);background:var(--amber-bg);padding:12px 14px;border-radius:0 8px 8px 0;font-size:.95rem}
.scenario .eyebrow{color:var(--amber);display:block;margin-bottom:4px}
.stem{font-size:1.1rem;font-weight:500;max-width:70ch}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--muted)}
.opt input{margin-top:4px;accent-color:var(--navy)}
.opt .key{font-family:var(--f-mono);font-weight:600;color:var(--muted);min-width:1.2em}
.opt.sel{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.locked{cursor:default}
.order{display:grid;gap:8px;counter-reset:ord}
.order li{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.order li::before{counter-increment:ord;content:counter(ord);font-family:var(--f-mono);font-weight:600;color:var(--muted);width:1.4em}
.order li span{flex:1;min-width:0}
.order li.right{border-color:var(--good);background:var(--good-bg)}
.order li.wrong{border-color:var(--bad);background:var(--bad-bg)}
.order ul{margin:0;padding:0}
.mv{display:flex;gap:4px}
.mv button{width:32px;height:32px;border:1px solid var(--line);background:var(--sunk);border-radius:6px;cursor:pointer;font-family:var(--f-mono)}
.feedback{border-radius:8px;padding:16px 18px;display:grid;gap:10px}
.feedback.ok{background:var(--good-bg)}
.feedback.no{background:var(--bad-bg)}
.feedback.part{background:var(--amber-bg)}
.feedback h3{display:flex;gap:8px;align-items:center}
.ok h3{color:var(--good)}.no h3{color:var(--bad)}.part h3{color:var(--amber)}
.bookref{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-top:1px dashed var(--line);padding-top:12px;font-size:.9rem}
.bookref .mod{font-family:var(--f-mono);font-weight:600;color:var(--navy)}
.concepts{display:flex;flex-wrap:wrap;gap:6px}
.model{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.95rem}
.qnav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.flagbtn[aria-pressed="true"]{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.palette button{height:34px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--f-mono);font-size:.8rem;cursor:pointer;font-variant-numeric:tabular-nums}
.palette button.ans{background:var(--sunk);color:var(--ink)}
.palette button.flag{border-color:var(--amber);box-shadow:inset 0 -3px 0 var(--amber)}
.palette button.cur{border-color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.palette button.r{background:var(--good-bg);border-color:var(--good)}
.palette button.w{background:var(--bad-bg);border-color:var(--bad)}
/* videos */
.vidrow{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:12px}
.vids{display:flex;flex-wrap:wrap;gap:8px}
.vid{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:.9rem;max-width:100%}
.vid:hover{border-color:var(--bad)}
.vid .play{flex:none;width:22px;height:16px;border-radius:4px;background:var(--bad);position:relative}
.vid .play::after{content:"";position:absolute;left:8px;top:4px;border-left:7px solid var(--surface);border-top:4px solid transparent;border-bottom:4px solid transparent}
.vid .len{font-size:.72rem;color:var(--muted);white-space:nowrap}
.vid.seen .play{background:var(--good)}
.vid.seen > span:nth-child(2)::after{content:" ✓";color:var(--good)}
.vlist{display:grid;gap:18px;padding:16px}
.vobj{display:grid;gap:8px}
.vobj-h{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:4px;font-size:.85rem}
.vobj-h .mono{font-weight:600;color:var(--navy)}
.vitem{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
.vchk input{width:18px;height:18px;margin-top:9px;accent-color:var(--good)}
.vbody{display:grid;gap:6px;min-width:0}
.vmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* pictures */
.offline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.9rem}
.visuals{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.dgrid>*,.pgrid>*{min-width:0}
.dgrid .wide{grid-column:1/-1}
.fig.wide .figart svg{max-height:none}
.fig{margin:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;display:grid;cursor:zoom-in}
.fig:hover{border-color:var(--muted)}
.figart{background:var(--sunk);padding:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.figart svg{width:100%;height:auto;max-height:260px}
.pfig .figart{padding:0;aspect-ratio:4/3;background:#f4f4f4}
.pfig img{width:100%;height:100%;object-fit:contain}
.pfig.broken .figart::after{content:"Photo didn\2019t load. Open the Commons link below.";font-size:.8rem;color:#666;padding:12px;text-align:center}
.pfig figcaption span{color:var(--muted)}
.fig.screen .figart{padding:0;background:#000}
.fig figcaption{padding:8px 10px;font-size:.84rem;display:grid;gap:3px}
.credit{font-size:.7rem;color:var(--muted);font-family:var(--f-mono)}
a.credit{text-decoration:underline;text-underline-offset:2px}
.plinks{display:flex;flex-wrap:wrap;gap:8px}
.photolink{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:.86rem;max-width:100%}
.photolink .pic{flex:none;width:20px;height:16px;border-radius:3px;border:2px solid var(--teal);position:relative}
.photolink .pic::after{content:"";position:absolute;left:2px;bottom:1px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:6px solid var(--teal)}
.photolink .credit{white-space:nowrap}
.zoomart{background:var(--sunk);border-radius:10px;padding:12px;display:flex;justify-content:center}
.zoomart.screen{background:#000;padding:0;overflow:hidden}
.zoomart svg,.zoomart img{width:100%;height:auto;max-height:70vh;object-fit:contain}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
button.vid{font:inherit;cursor:pointer;text-align:left}
svg .dt{fill:var(--ink);font-family:var(--f-body)} svg .dm{fill:var(--muted);font-family:var(--f-body)} svg .mono{font-family:var(--f-mono)}
svg .dbox{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
svg .dacc{fill:var(--teal)} svg .don{fill:var(--surface);font-family:var(--f-body)}
svg .dline{stroke:var(--muted);stroke-width:1.5;fill:none}
svg .darrow{stroke:var(--teal);stroke-width:2} svg .darrow2{stroke:var(--amber);stroke-width:2}
svg .dheadfill{fill:var(--teal)} svg .dheadfill2{fill:var(--amber)} svg .dheadfill3{fill:var(--muted)}
svg .dloop{stroke:var(--amber);stroke-width:1.8;fill:none;stroke-dasharray:4 3}
svg .dblk{fill:var(--teal-bg);stroke:var(--teal)} svg .dpar{fill:var(--amber-bg);stroke:var(--amber)}
svg .dchan{fill:var(--teal-bg);fill-opacity:.55;stroke:var(--teal);stroke-width:2} svg .dchan2{fill:none;stroke:var(--line);stroke-width:1.2}
svg .dfull{fill:var(--navy)} svg .dchg{fill:var(--teal)}
/* lookup bubble */
.lookup{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(8,14,26,.22);font-size:.9rem;max-width:min(380px,calc(100vw - 16px))}
.lk-actions{display:flex;align-items:center;gap:4px;padding:5px}
.lk-term{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);padding:0 6px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk-btn{border:0;background:var(--navy);color:var(--surface);font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer}
.lk-btn+.lk-btn{background:var(--teal)}
:root[data-theme="dark"] .lk-btn{color:#0b1322}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lk-btn{color:#0b1322}}
.lookup.open{padding:14px 16px;display:grid;gap:10px;width:380px}
.lk-head{display:flex;align-items:baseline;gap:8px}
.lk-head b{font-family:var(--f-display);font-size:1.05rem;flex:1;min-width:0;overflow-wrap:anywhere}
.lk-x{border:0;background:none;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.lk-acro{margin:0}.lk-acro .mono{font-weight:600;color:var(--navy)}
.lk-def{margin:0;line-height:1.5}
.lk-plain{font-size:.95rem;font-weight:500}
.lk-more{font-size:.84rem;color:var(--muted)}
.lk-src{margin:-4px 0 0;font-size:.78rem;color:var(--muted)}
.lk-link{border:0;background:none;color:var(--navy);font-weight:600;cursor:pointer;padding:0;font-size:.85rem;text-decoration:underline;text-underline-offset:2px}
.lk-foot{display:flex;flex-wrap:wrap;gap:14px;border-top:1px solid var(--line);padding-top:8px}
.lk-refs{display:grid;gap:6px}
.lk-ref{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer}
.lk-ref:hover{border-color:var(--muted)}
.lk-ref small{display:block;color:var(--muted);font-size:.75rem}
.lk-vids .vid{font-size:.82rem}
.lk-tutor .out{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.88rem}
/* AI tutor */
.ai-only{display:none!important}
body.has-ai .ai-only{display:revert!important}
.tutor{border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:14px 16px;display:grid;gap:8px}
.tutor .out{white-space:pre-wrap;font-size:.95rem}
.tutor .eyebrow{color:var(--teal)}
/* search */
.searchbar{display:flex;gap:10px}
.searchbar input{font-size:1.05rem;padding:12px 14px}
.results{display:grid;gap:26px}
.rgroup{display:grid;gap:10px}
.hit{display:grid;gap:4px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left}
.hit:hover{border-color:var(--muted)}
.hit .t{font-weight:600}
.hit .s{font-size:.9rem;color:var(--muted)}
mark{background:var(--amber-bg);color:inherit;padding:0 2px;border-radius:2px}
.acro{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 14px;font-size:.92rem}
.acro b{font-family:var(--f-mono)}
.qhit{padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:grid;gap:8px}
.qhit summary{cursor:pointer;font-weight:500}
.suggest{display:flex;flex-wrap:wrap;gap:8px}
/* article */
.article{display:grid;gap:14px}
.article .body{max-width:72ch}
.article .body p,.article .body ul,.article .body ol{margin:0 0 12px}
.article .body li{margin:4px 0}
.tablewrap{overflow-x:auto}
.article table,.tablewrap table{border-collapse:collapse;width:100%;font-size:.9rem;margin:6px 0 14px}
.article th,.article td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.article th{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
/* book map */
.mods{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.mods details{border-top:1px solid var(--line)}
.mods details:first-child{border-top:0}
.mods summary{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;list-style:none}
.mods summary::-webkit-details-marker{display:none}
.mods .no{font-family:var(--f-mono);font-weight:600;color:var(--navy);font-size:.85rem}
.mods .count{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.mods .inner{padding:0 16px 16px 92px;display:grid;gap:10px}
.mods .part{background:var(--sunk);padding:8px 16px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}
.mods .part:first-child{border-top:0}
.linklist{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:640px){.mods .inner{padding-left:16px}.mods summary{grid-template-columns:44px minmax(0,1fr)}.mods .count{grid-column:2}.qcard{padding:18px}.dom{grid-template-columns:minmax(0,1fr) 80px 46px}}
/* modal */
.modal{position:fixed;inset:0;background:rgba(8,14,26,.55);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal .sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:760px;width:100%;padding:24px;display:grid;gap:16px}
/* results */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.score div{padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.score b{display:block;font-family:var(--f-mono);font-size:1.6rem;font-variant-numeric:tabular-nums}
.verdict{font-family:var(--f-display);font-weight:800;font-size:1.5rem}
.verdict.pass{color:var(--good)}.verdict.fail{color:var(--bad)}
.note{font-size:.85rem;color:var(--muted);max-width:70ch}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
@media (prefers-reduced-motion:no-preference){.qcard,.feedback{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}

// Study notes — Core 1 (220-1201). Original summaries written for this app.
const KB1 = [
{id:"safety-esd", m:1, ex:1, d:3, title:"ESD protection and safe work habits", kw:"esd electrostatic discharge antistatic wrist strap mat bag ground static safety",
body:`<p>Electrostatic discharge (ESD) is static electricity jumping between two objects at different charge levels. You can't feel a discharge below roughly 3,000 V, yet as little as about 10 V can damage a chip, so damage is often invisible and may show up later as an intermittent fault.</p>
<ul><li><b>Antistatic wrist strap</b>: clip to a bare metal part of the case (ground bracelet) so your body and the computer stay at the same potential.</li>
<li><b>ESD mat</b>: place components on it; connect it to ground.</li>
<li><b>Antistatic bags</b>: store and ship parts in them. Don't set a part on top of the bag; the outside can hold a charge.</li>
<li>Touch the case before touching components if you have no strap. Hold cards by the edges. Low humidity increases static.</li>
<li>Never wear a wrist strap while working inside a power supply or CRT monitor; those hold dangerous charges and the strap would make you the path to ground.</li></ul>
<p>Before opening a desktop, power down, unplug, then press the power button to drain residual power. For a laptop, also remove the battery (or disconnect it internally) first.</p>`},

{id:"pc-tools", m:1, ex:1, d:3, title:"Technician toolkit and disassembly workflow", kw:"tools screwdriver torx spudger loupe multimeter power supply tester post card disassembly reassembly documentation",
body:`<p>Common tools: Phillips #1 and #2 screwdrivers, Torx (T10/T15 on many cases and laptops), flat-blade, tweezers or extractor, spudger and plastic pry tools (for laptops and phones), flashlight, compressed air, antistatic gear, multimeter, power supply tester, and a POST diagnostic card.</p>
<ul><li>Before disassembly: back up data, take photos, label cables, and keep screws organized by location (a magnetic mat or labeled cups).</li>
<li>Consult the manufacturer's service manual, especially for laptops, where screws differ in length and using the wrong screw can puncture a board.</li>
<li>Reassemble in reverse order, then verify full functionality before closing the case.</li></ul>`},

{id:"form-factors", m:2, ex:1, d:3, title:"Motherboard form factors", kw:"atx microatx mini-itx itx form factor case motherboard size",
body:`<table><tr><th>Form factor</th><th>Approx. size</th><th>Notes</th></tr>
<tr><td>ATX</td><td>12 × 9.6 in</td><td>Most common full-size board; up to 7 expansion slots</td></tr>
<tr><td>microATX (mATX)</td><td>9.6 × 9.6 in</td><td>Fits most ATX cases; fewer slots</td></tr>
<tr><td>Mini-ITX</td><td>6.7 × 6.7 in</td><td>Small form factor (SFF), home theater and compact PCs; usually one slot</td></tr></table>
<p>The case, power supply, and motherboard must share a compatible form factor. A smaller board usually fits a larger case because the mounting holes line up with a subset of standoffs.</p>`},

{id:"mb-components", m:2, ex:1, d:3, title:"Motherboard components, slots and connectors", kw:"pcie pci express x1 x4 x16 lanes sata m.2 headers front panel chipset slot expansion card connector 24-pin",
body:`<ul><li><b>PCI Express (PCIe)</b>: serial point-to-point expansion bus. Slots come in x1, x4, x8, x16 (lanes). A x1 card works in a x16 slot. Video cards use x16. Each newer PCIe version roughly doubles per-lane throughput.</li>
<li><b>SATA</b> ports connect hard drives, SSDs and optical drives.</li>
<li><b>M.2</b> slots hold SSDs (SATA or NVMe) and sometimes Wi-Fi cards. Keys (B, M, B+M) determine compatibility.</li>
<li><b>Headers</b>: front-panel (power switch, reset, LEDs), USB, audio, fan headers (3-pin or 4-pin PWM).</li>
<li><b>Power</b>: 24-pin P1 main connector; 4/8-pin CPU (ATX12V/EPS12V) connector.</li>
<li><b>Chipset</b>: controls communication between the CPU and devices. Modern CPUs integrate the memory controller and some PCIe lanes; the remaining chipset (PCH) handles the rest.</li>
<li>Add-on cards: sound, video (GPU), capture card, network interface card (NIC).</li></ul>`},

{id:"bios-uefi", m:2, ex:1, d:3, title:"BIOS/UEFI firmware settings", kw:"bios uefi firmware setup secure boot tpm boot order password cmos battery flash update virtualization",
body:`<p>Firmware on the motherboard performs POST and starts the boot loader. Modern systems use <b>UEFI</b> (Unified Extensible Firmware Interface), which supports GPT drives larger than 2 TB, a mouse-driven setup, faster boot, and Secure Boot. Legacy BIOS used MBR.</p>
<ul><li>Common settings: boot order/priority, enabling/disabling devices, date/time, fan control, CPU virtualization (Intel VT-x / AMD-V), Secure Boot, TPM, and supervisor/user passwords.</li>
<li><b>Secure Boot</b> ensures only signed boot loaders run, blocking boot-sector malware.</li>
<li><b>TPM</b> (Trusted Platform Module) is a chip (or firmware fTPM/PTT) that stores encryption keys; Windows 11 requires TPM 2.0. BitLocker uses it.</li>
<li><b>HSM</b> (hardware security module) is a separate device for managing keys in enterprise settings.</li>
<li>The <b>CMOS battery</b> (CR2032 coin cell) keeps settings and the clock. A dead battery causes the clock to reset and settings to be lost each boot.</li>
<li>Updating (flashing) firmware fixes bugs and adds support for new CPUs; never interrupt power during a flash.</li></ul>`},

{id:"cpu", m:3, ex:1, d:3, title:"Processors: sockets, cores and cooling", kw:"cpu processor socket lga pga intel amd core thread hyperthreading smt cache arm x86 x64 cooling thermal paste heat sink fan liquid",
body:`<ul><li><b>Socket types</b>: Intel uses LGA (pins on the board); AMD AM5 also uses LGA; older AMD AM4 used PGA (pins on the CPU). CPU and socket must match.</li>
<li><b>Architecture</b>: x86/x64 (Intel, AMD) on most PCs; ARM on phones, tablets, Apple Silicon Macs, and some Windows laptops. ARM is more power-efficient.</li>
<li><b>Multicore</b>: several cores in one package. <b>Hyperthreading/SMT</b> lets one core run two threads.</li>
<li><b>Virtualization support</b> (VT-x, AMD-V) must be enabled in firmware to run hypervisors.</li>
<li><b>Cooling</b>: heat sink + fan, or liquid cooling (pump, radiator). Apply thermal paste (or a pad) between the CPU and heat sink to fill microscopic gaps. Overheating leads to throttling, shutdowns, and random reboots.</li></ul>`},

{id:"ram", m:3, ex:1, d:3, title:"Memory (RAM) types and configuration", kw:"ram memory ddr4 ddr5 dimm sodimm ecc dual channel quad channel virtual memory paging speed upgrade",
body:`<table><tr><th>Type</th><th>Pins (DIMM)</th><th>Notes</th></tr>
<tr><td>DDR4</td><td>288</td><td>1.2 V; notch position differs from DDR5</td></tr>
<tr><td>DDR5</td><td>288</td><td>1.1 V; two 32-bit subchannels per module, on-module power management and on-die ECC</td></tr></table>
<ul><li><b>DIMM</b> for desktops; <b>SODIMM</b> (small outline) for laptops and mini PCs.</li>
<li><b>ECC</b> (error-correcting code) memory detects and fixes single-bit errors; used in servers. Requires board/CPU support. (DDR5 on-die ECC is not the same as full ECC.)</li>
<li><b>Channels</b>: dual-, triple-, quad-channel configurations increase bandwidth; install matched modules in the color-coded slots the manual specifies.</li>
<li><b>Virtual memory</b>: the OS uses a paging file on the drive when RAM fills; heavy paging makes a system slow, so adding RAM helps.</li>
<li>Mixing speeds causes all modules to run at the slowest speed.</li></ul>`},

{id:"psu", m:4, ex:1, d:3, title:"Power supplies", kw:"psu power supply wattage 80 plus modular connector 24-pin molex sata power 12v 5v 3.3v redundant voltage input 115 230 auto-switching",
body:`<ul><li>Converts AC from the wall to DC: +12 V (CPU, GPU, drives' motors, fans), +5 V, +3.3 V.</li>
<li>Most modern PSUs are <b>auto-switching</b> (100–240 V); older units have a manual 115/230 V switch.</li>
<li>Connectors: 24-pin P1, 4+4-pin CPU, 6+2-pin PCIe for graphics cards, SATA power, Molex (older drives).</li>
<li><b>Wattage</b>: add up component needs and leave headroom (about 25–30%). A GPU upgrade often requires a larger PSU.</li>
<li><b>Modular</b> PSUs let you attach only the cables you need; <b>redundant</b> PSUs in servers keep running if one fails.</li>
<li><b>80 Plus</b> ratings (Bronze, Silver, Gold, Platinum, Titanium) indicate efficiency.</li>
<li>Never open a PSU; capacitors hold a charge after unplugging. Replace it as a unit.</li></ul>`},

{id:"troubleshoot-method", m:4, ex:1, d:5, title:"CompTIA troubleshooting methodology", kw:"troubleshooting methodology steps identify problem theory probable cause test plan of action verify document seven steps",
body:`<ol><li><b>Identify the problem</b>: gather information from the user, identify user changes, and (if applicable) perform backups before making changes. Question the user, identify symptoms, review logs.</li>
<li><b>Establish a theory of probable cause</b> (question the obvious). If necessary, conduct external or internal research based on symptoms.</li>
<li><b>Test the theory to determine the cause</b>. If confirmed, determine next steps; if not, establish a new theory or escalate.</li>
<li><b>Establish a plan of action</b> to resolve the problem and implement the solution, referring to vendor instructions for guidance.</li>
<li><b>Verify full system functionality</b> and, if applicable, implement preventive measures.</li>
<li><b>Document</b> findings, actions, and outcomes.</li></ol>
<p>The exam expects you to recognize the step a technician is on. Backups come before changes. Escalation happens when a theory can't be confirmed or the fix is beyond your scope. Documentation is always last.</p>`},

{id:"hw-symptoms", m:4, ex:1, d:5, title:"Hardware troubleshooting symptoms", kw:"post beep codes no power overheating burning smell grinding noise blue screen bsod random reboot intermittent shutdown capacitor swollen fan noise led",
body:`<table><tr><th>Symptom</th><th>Likely causes</th></tr>
<tr><td>No power, no fans, no lights</td><td>Outlet, power cable, PSU switch, failed PSU, front power button header</td></tr>
<tr><td>Fans spin, no display, beeps</td><td>POST failure; beep code points to RAM, video or CPU. Reseat RAM first</td></tr>
<tr><td>Random shutdowns/reboots</td><td>Overheating (dust, failed fan, dried paste), failing PSU, bad RAM</td></tr>
<tr><td>Burning smell</td><td>Failing component or PSU; power off immediately</td></tr>
<tr><td>Grinding/clicking noise</td><td>Failing HDD (back up now), fan bearing</td></tr>
<tr><td>Swollen/leaking capacitors</td><td>Board failure; replace motherboard</td></tr>
<tr><td>Clock resets every boot</td><td>Dead CMOS battery</td></tr>
<tr><td>Stop error (BSOD) / kernel panic</td><td>Bad RAM, driver, overheating; run memory diagnostic</td></tr>
<tr><td>Intermittent device failure</td><td>Loose connection, ESD damage, failing component</td></tr></table>
<p>Tools: POST card, power supply tester, multimeter, and the manufacturer's diagnostic LEDs or codes.</p>`},

{id:"storage-types", m:5, ex:1, d:3, title:"Storage drives: HDD, SSD, NVMe, M.2", kw:"hdd ssd nvme m.2 sata rpm 5400 7200 10000 15000 flash 2.5 3.5 msata form factor drive",
body:`<ul><li><b>HDD</b> (magnetic): spinning platters; speeds 5,400, 7,200, 10,000, 15,000 RPM. 3.5-in desktop, 2.5-in laptop. Cheap per GB, slower, vulnerable to shock.</li>
<li><b>SSD</b>: flash memory, no moving parts, fast, silent. Interfaces: SATA (≈600 MB/s ceiling), or <b>NVMe</b> over PCIe (several GB/s).</li>
<li><b>M.2</b> is a form factor, not an interface: an M.2 drive may be SATA or NVMe. Sizes like 2280 = 22 mm wide × 80 mm long.</li>
<li>Removable: USB flash drives, SD/microSD cards, external drives; optical (CD 700 MB, DVD 4.7/8.5 GB, Blu-ray 25/50 GB).</li>
<li>Don't defragment SSDs; Windows uses TRIM to optimize them instead.</li></ul>`},

{id:"raid", m:5, ex:1, d:3, title:"RAID levels", kw:"raid 0 1 5 6 10 striping mirroring parity fault tolerance redundancy array",
body:`<table><tr><th>Level</th><th>Min drives</th><th>How</th><th>Fault tolerance</th></tr>
<tr><td>RAID 0</td><td>2</td><td>Striping</td><td>None; faster, full capacity. One failure loses all data</td></tr>
<tr><td>RAID 1</td><td>2</td><td>Mirroring</td><td>Survives one drive failure; 50% capacity</td></tr>
<tr><td>RAID 5</td><td>3</td><td>Striping with distributed parity</td><td>Survives one drive failure; capacity = n−1 drives</td></tr>
<tr><td>RAID 6</td><td>4</td><td>Striping with double parity</td><td>Survives two drive failures; capacity = n−2</td></tr>
<tr><td>RAID 10 (1+0)</td><td>4</td><td>Striped mirrors</td><td>Survives a drive failure in each mirror; fast; 50% capacity</td></tr></table>
<p>RAID is not a backup: deleted or encrypted files are deleted or encrypted on every drive in the array.</p>`},

{id:"storage-troubleshoot", m:5, ex:1, d:5, title:"Troubleshooting drives and RAID", kw:"drive not recognized smart failure clicking bootable device not found raid failure degraded array slow io lights missing drives",
body:`<ul><li><b>S.M.A.R.T.</b> warnings predict failure: back up immediately and replace.</li>
<li><b>Clicking/grinding</b>: mechanical HDD failure.</li>
<li><b>Bootable device not found</b>: check boot order in UEFI, cables, drive detected in firmware, then the boot loader.</li>
<li><b>Drive not recognized</b>: check data/power cables, firmware enables the port, try another port, check Disk Management for uninitialized disk.</li>
<li><b>Degraded RAID array</b>: replace the failed drive promptly and let the array rebuild; a second failure in RAID 5 loses data.</li>
<li><b>Extended read/write times, high IOPS waits</b>: failing drive or nearly full drive.</li>
<li><b>LED status indicators</b> on servers/arrays show failed drives (often amber).</li></ul>`},

{id:"cables-video", m:6, ex:1, d:3, title:"Video cables and connectors", kw:"hdmi displayport dvi vga usb-c thunderbolt video cable connector analog digital adapter",
body:`<table><tr><th>Connector</th><th>Signal</th><th>Notes</th></tr>
<tr><td>VGA (DE-15)</td><td>Analog</td><td>Blue 15-pin, 3 rows; legacy projectors</td></tr>
<tr><td>DVI</td><td>Digital (DVI-D) or both (DVI-I)</td><td>DVI-A analog only</td></tr>
<tr><td>HDMI</td><td>Digital audio + video</td><td>TVs, monitors; supports 4K/8K in newer versions</td></tr>
<tr><td>DisplayPort</td><td>Digital audio + video</td><td>Common on PCs/monitors; supports daisy-chaining (MST)</td></tr>
<tr><td>USB-C (DP Alt Mode) / Thunderbolt</td><td>Digital</td><td>Single cable for video, data, power</td></tr></table>
<p>Converting digital to VGA requires an active adapter (it converts signal types).</p>`},

{id:"cables-usb", m:6, ex:1, d:3, title:"USB, Thunderbolt and peripheral cables", kw:"usb 2.0 3.0 3.1 3.2 usb4 type-a type-b type-c micro lightning thunderbolt serial db9 sata esata molex speeds",
body:`<table><tr><th>Standard</th><th>Speed</th></tr>
<tr><td>USB 2.0 (Hi-Speed)</td><td>480 Mbps</td></tr>
<tr><td>USB 3.2 Gen 1 (formerly 3.0)</td><td>5 Gbps</td></tr>
<tr><td>USB 3.2 Gen 2</td><td>10 Gbps</td></tr>
<tr><td>USB 3.2 Gen 2x2</td><td>20 Gbps (USB-C)</td></tr>
<tr><td>USB4</td><td>up to 40 Gbps (newer versions faster)</td></tr>
<tr><td>Thunderbolt 3/4</td><td>40 Gbps over USB-C connector</td></tr></table>
<ul><li>Connectors: Type-A, Type-B, Mini, Micro, and reversible <b>Type-C</b>. Apple's legacy <b>Lightning</b> connector (iPhone 5–14).</li>
<li>USB 2.0 cable max length about 5 m; USB 3.x about 3 m.</li>
<li><b>Serial (DB9/RS-232)</b> still used for console connections to network gear. Peripheral cables also include SATA, eSATA (legacy external), and Molex power.</li></ul>`},

{id:"displays", m:6, ex:1, d:3, title:"Monitors and display technologies", kw:"lcd led oled ips tn va mini-led refresh rate resolution pixel response time brightness nits projector touch screen",
body:`<ul><li><b>LCD panels</b>: IPS (best color and viewing angles), TN (fast response, poor angles, cheap), VA (high contrast, in between). Backlight is LED (edge-lit or mini-LED).</li>
<li><b>OLED</b>: each pixel emits its own light; true blacks, no backlight; risk of burn-in.</li>
<li><b>Refresh rate</b> (Hz) and <b>response time</b> (ms) matter for gaming; <b>resolution</b> (1080p, 1440p, 4K) and <b>brightness</b> (nits/lumens for projectors).</li>
<li>Projectors: lumens determine visibility in lit rooms; bulbs (lamps) wear out; laser projectors last longer.</li></ul>`},

{id:"display-troubleshoot", m:6, ex:1, d:5, title:"Troubleshooting video and display issues", kw:"no image dim image flickering dead pixel burn-in incorrect color fuzzy distorted audio projector shutdown intermittent video",
body:`<table><tr><th>Symptom</th><th>Check</th></tr>
<tr><td>No image</td><td>Monitor power/input source, cable, second display, video card seated, brightness</td></tr>
<tr><td>Dim image (laptop)</td><td>Brightness keys, backlight or inverter (older CCFL) failure</td></tr>
<tr><td>Flickering</td><td>Loose/damaged cable, refresh rate, failing backlight, laptop hinge cable</td></tr>
<tr><td>Fuzzy image</td><td>Not at native resolution</td></tr>
<tr><td>Dead/stuck pixels</td><td>Panel defect; stuck pixels sometimes recover</td></tr>
<tr><td>Burned-in image</td><td>OLED/plasma static content</td></tr>
<tr><td>Incorrect color display</td><td>Bent pins, cable, color profile/calibration</td></tr>
<tr><td>Projector shuts down</td><td>Overheating: clean filters and vents</td></tr></table>`},

{id:"peripherals", m:6, ex:1, d:3, title:"Input devices, KVM and peripherals", kw:"kvm switch keyboard mouse webcam microphone barcode scanner nfc smart card reader signature pad touch pad headset speakers driver",
body:`<ul><li><b>KVM switch</b>: one keyboard, video display, and mouse controlling multiple computers.</li>
<li>Other devices: webcams, microphones, barcode/QR scanners, smart card readers, signature pads, touch pens, game controllers, external storage.</li>
<li>Most peripherals are plug-and-play over USB; install the vendor driver when Windows' generic driver lacks features.</li>
<li>Device Manager shows devices with problems (yellow exclamation); update or roll back drivers there.</li></ul>`},

{id:"ports-protocols", m:7, ex:1, d:2, title:"TCP/UDP ports and protocols", kw:"port protocol ftp ssh telnet smtp dns dhcp http https pop3 imap netbios ldap smb cifs rdp snmp tcp udp 20 21 22 23 25 53 67 68 80 110 137 139 143 161 162 389 443 445 3389",
body:`<table><tr><th>Port</th><th>Protocol</th><th>Purpose</th><th>TCP/UDP</th></tr>
<tr><td>20/21</td><td>FTP</td><td>File transfer (data/control)</td><td>TCP</td></tr>
<tr><td>22</td><td>SSH</td><td>Secure remote shell; also SFTP</td><td>TCP</td></tr>
<tr><td>23</td><td>Telnet</td><td>Unencrypted remote terminal</td><td>TCP</td></tr>
<tr><td>25</td><td>SMTP</td><td>Sending email</td><td>TCP</td></tr>
<tr><td>53</td><td>DNS</td><td>Name resolution</td><td>TCP/UDP</td></tr>
<tr><td>67/68</td><td>DHCP</td><td>Automatic IP addressing</td><td>UDP</td></tr>
<tr><td>80</td><td>HTTP</td><td>Web</td><td>TCP</td></tr>
<tr><td>110</td><td>POP3</td><td>Downloading email</td><td>TCP</td></tr>
<tr><td>137–139</td><td>NetBIOS/NetBT</td><td>Legacy Windows naming/sessions</td><td>TCP/UDP</td></tr>
<tr><td>143</td><td>IMAP</td><td>Email synced on server</td><td>TCP</td></tr>
<tr><td>161/162</td><td>SNMP</td><td>Device monitoring (162 = traps)</td><td>UDP</td></tr>
<tr><td>389</td><td>LDAP</td><td>Directory queries (Active Directory)</td><td>TCP</td></tr>
<tr><td>443</td><td>HTTPS</td><td>Secure web (TLS)</td><td>TCP</td></tr>
<tr><td>445</td><td>SMB/CIFS</td><td>Windows file and printer sharing</td><td>TCP</td></tr>
<tr><td>3389</td><td>RDP</td><td>Remote Desktop</td><td>TCP</td></tr></table>
<p><b>TCP</b> is connection-oriented (three-way handshake, guaranteed delivery). <b>UDP</b> is connectionless and faster with no delivery guarantee (streaming, VoIP, DNS queries, DHCP).</p>`},

{id:"ip-addressing", m:7, ex:1, d:2, title:"IPv4, IPv6, DHCP, DNS and APIPA", kw:"ipv4 ipv6 private public address 10 172.16 192.168 apipa 169.254 subnet mask default gateway dhcp scope lease reservation exclusion dns record a aaaa mx cname txt spf dkim dmarc static dynamic loopback 127.0.0.1",
body:`<ul><li><b>IPv4</b>: 32-bit, dotted decimal. <b>Private ranges</b> (RFC 1918): 10.0.0.0/8, 172.16.0.0–172.31.255.255 (/12), 192.168.0.0/16. Routers use NAT to share one public address.</li>
<li><b>APIPA</b>: 169.254.x.x. A Windows host assigns itself one when it can't reach a DHCP server. It means "no DHCP" and gives local-only connectivity.</li>
<li><b>Loopback</b>: 127.0.0.1 (IPv4), ::1 (IPv6).</li>
<li><b>Subnet mask</b> separates network and host portions (255.255.255.0 = /24). <b>Default gateway</b> is the router address used to reach other networks.</li>
<li><b>IPv6</b>: 128-bit hex; link-local addresses start with fe80::. Leading zeros can be dropped and one run of zero groups shortened to ::.</li>
<li><b>DHCP</b>: scope (address pool), lease, reservation (same IP for a MAC address), exclusions. Process: Discover, Offer, Request, Acknowledge (DORA).</li>
<li><b>DNS records</b>: A (IPv4), AAAA (IPv6), MX (mail server), CNAME (alias), TXT (text, used for SPF, DKIM, DMARC email anti-spoofing).</li>
<li><b>Static</b> addressing for servers and printers; <b>dynamic</b> for clients.</li></ul>`},

{id:"net-types", m:7, ex:1, d:2, title:"Network types and VLAN/VPN concepts", kw:"lan wan pan man san wlan vlan vpn network type",
body:`<ul><li><b>PAN</b>: personal (Bluetooth). <b>LAN</b>: one building. <b>WLAN</b>: wireless LAN. <b>MAN</b>: city/campus. <b>WAN</b>: large geographic area (the internet). <b>SAN</b>: storage area network, block-level storage for servers.</li>
<li><b>VLAN</b>: a switch logically divides one physical network into separate broadcast domains (e.g., separating guest, VoIP and staff traffic).</li>
<li><b>VPN</b>: an encrypted tunnel over a public network that lets remote users access a private network.</li></ul>`},

{id:"wireless", m:7, ex:1, d:2, title:"Wireless standards: Wi-Fi, Bluetooth, NFC, RFID", kw:"802.11 a b g n ac ax be wifi 4 5 6 6e 7 2.4 ghz 5 ghz 6 ghz channels 1 6 11 bluetooth nfc rfid frequency band",
body:`<table><tr><th>Standard</th><th>Name</th><th>Bands</th></tr>
<tr><td>802.11a</td><td>—</td><td>5 GHz</td></tr>
<tr><td>802.11b/g</td><td>—</td><td>2.4 GHz</td></tr>
<tr><td>802.11n</td><td>Wi-Fi 4</td><td>2.4 and 5 GHz, MIMO</td></tr>
<tr><td>802.11ac</td><td>Wi-Fi 5</td><td>5 GHz, MU-MIMO</td></tr>
<tr><td>802.11ax</td><td>Wi-Fi 6 / 6E</td><td>2.4, 5 GHz; 6E adds 6 GHz</td></tr>
<tr><td>802.11be</td><td>Wi-Fi 7</td><td>2.4, 5, 6 GHz</td></tr></table>
<ul><li>2.4 GHz: longer range, more interference, only three non-overlapping channels (1, 6, 11). 5/6 GHz: faster, more channels, shorter range.</li>
<li>Regulations limit channels and power by country.</li>
<li><b>Bluetooth</b>: short-range PAN; requires pairing. <b>NFC</b>: a few centimeters; contactless payment, badge access. <b>RFID</b>: tags for inventory and access badges.</li></ul>`},

{id:"soho-config", m:7, ex:1, d:2, title:"SOHO router configuration and host services", kw:"soho router configuration dhcp dns server web server file server print server mail server syslog aaa radius proxy spam gateway utm load balancer legacy embedded scada iot",
body:`<ul><li>Typical SOHO router: combines router, switch, wireless AP, DHCP server, firewall and NAT.</li>
<li>Networked host roles: DNS, DHCP, file share, print, mail, <b>syslog</b> (collects logs), web, <b>AAA</b> (authentication, authorization, accounting, e.g., RADIUS), database.</li>
<li>Internet appliances: <b>spam gateway</b>, <b>UTM</b> (unified threat management: firewall, IDS/IPS, antivirus in one), <b>load balancer</b>, <b>proxy server</b> (caches, filters and makes requests on clients' behalf).</li>
<li><b>Legacy/embedded systems</b> like <b>SCADA</b> (industrial control) and <b>IoT</b> devices often can't be patched and should be isolated on their own network segment.</li></ul>`},

{id:"net-hardware", m:8, ex:1, d:2, title:"Networking hardware", kw:"switch managed unmanaged router access point patch panel firewall poe injector hub nic modem cable dsl ont sdn",
body:`<ul><li><b>Switch</b>: forwards frames by MAC address within a LAN. <b>Managed</b> switches support VLANs, port configuration, and monitoring; <b>unmanaged</b> are plug-and-play.</li>
<li><b>Router</b>: forwards packets between networks by IP address.</li>
<li><b>Access point</b>: connects wireless clients to the wired network.</li>
<li><b>Patch panel</b>: termination point for cable runs in a wiring closet.</li>
<li><b>Firewall</b>: filters traffic by rules (ports, addresses, applications).</li>
<li><b>PoE</b> (Power over Ethernet): powers APs, VoIP phones and cameras over network cable; delivered by a PoE switch or an injector. Standards 802.3af (15.4 W), 802.3at PoE+ (30 W), 802.3bt (60–100 W).</li>
<li><b>Modems</b>: cable modem (DOCSIS), DSL modem, fiber ONT.</li>
<li><b>NIC</b>: network interface card with a unique MAC address.</li>
<li><b>SDN</b> (software-defined networking) separates control from forwarding so the network is managed centrally in software.</li></ul>`},

{id:"net-cabling", m:8, ex:1, d:3, title:"Network cabling: copper and fiber", kw:"cat5e cat6 cat6a cat7 utp stp plenum direct burial t568a t568b straight-through crossover rj45 rj11 fiber single-mode multimode lc sc st coax rg6 f connector",
body:`<table><tr><th>Cable</th><th>Max speed</th><th>Max length</th></tr>
<tr><td>Cat 5e</td><td>1 Gbps</td><td>100 m</td></tr>
<tr><td>Cat 6</td><td>10 Gbps (to 55 m), 1 Gbps to 100 m</td><td>100 m</td></tr>
<tr><td>Cat 6a</td><td>10 Gbps</td><td>100 m</td></tr></table>
<ul><li><b>UTP</b> vs <b>STP</b> (shielded, resists EMI). <b>Plenum</b>-rated jackets are fire-resistant and required in air-handling spaces above ceilings. <b>Direct burial</b> for underground runs.</li>
<li><b>T568A/T568B</b> wiring standards; the same standard on both ends = straight-through. A on one end and B on the other = crossover (rarely needed thanks to Auto-MDIX).</li>
<li>Connectors: RJ45 (Ethernet), RJ11 (phone/DSL), F-type (coax RG-6), fiber LC, SC, ST.</li>
<li><b>Fiber</b>: immune to EMI, long distances. Single-mode (SMF) is laser and longest distance; multimode (MMF) is shorter distances and cheaper.</li></ul>`},

{id:"net-tools", m:8, ex:1, d:2, title:"Network tools", kw:"crimper cable stripper punchdown tool tone generator probe toner cable tester loopback plug multimeter wifi analyzer network tap",
body:`<ul><li><b>Crimper</b>: attaches RJ45 connectors. <b>Cable stripper</b>: removes jacket.</li>
<li><b>Punchdown tool</b>: terminates wires in patch panels and keystone jacks (110 blocks).</li>
<li><b>Toner probe</b> (tone generator + probe): traces/locates a cable in a bundle or wall.</li>
<li><b>Cable tester</b>: checks continuity and wiring order (opens, shorts, crossed pairs).</li>
<li><b>Loopback plug</b>: tests a NIC or port by sending signal back to itself.</li>
<li><b>Wi-Fi analyzer</b>: shows SSIDs, channels, signal strength; finds interference and channel overlap.</li>
<li><b>Network tap</b>: copies traffic for monitoring.</li></ul>`},

{id:"internet-types", m:8, ex:1, d:2, title:"Internet connection types", kw:"fiber cable dsl satellite cellular 5g 4g wisp fixed wireless leo starlink latency isp",
body:`<ul><li><b>Fiber</b>: fastest, symmetrical options, low latency.</li>
<li><b>Cable</b>: coaxial (DOCSIS); bandwidth shared with neighbors.</li>
<li><b>DSL</b>: over phone lines; speed drops with distance from the provider.</li>
<li><b>Satellite</b>: rural coverage; traditional geostationary has high latency. Low Earth orbit (LEO) services reduce latency.</li>
<li><b>Cellular</b> (4G/5G): mobile hotspots and fixed wireless home internet.</li>
<li><b>WISP</b>: wireless ISP using fixed antennas (line of sight) to reach rural customers.</li></ul>`},

{id:"virtualization", m:8, ex:1, d:4, title:"Client-side virtualization", kw:"virtualization hypervisor type 1 type 2 bare metal hosted vm virtual machine sandbox test development legacy software emulation container resource requirements vdi",
body:`<ul><li><b>Type 1 hypervisor</b> (bare metal): runs directly on hardware (Hyper-V Server, VMware ESXi). Used in data centers.</li>
<li><b>Type 2 hypervisor</b> (hosted): runs on top of an OS (VirtualBox, VMware Workstation). Used on desktops.</li>
<li>Uses: <b>sandbox</b> for testing untrusted apps, test/development, running legacy software/OS, cross-platform.</li>
<li>Requirements: CPU virtualization extensions enabled in UEFI, enough RAM and storage for host plus guests, network configured (NAT, bridged, internal).</li>
<li>VMs need their own security (antivirus, patches) and licenses.</li>
<li><b>Containers</b> share the host OS kernel and are lighter than VMs.</li>
<li><b>VDI</b> (virtual desktop infrastructure) hosts desktops on servers, either on-premises or in the cloud.</li></ul>`},

{id:"cloud", m:8, ex:1, d:4, title:"Cloud computing concepts", kw:"cloud iaas paas saas public private hybrid community shared resources elasticity metered utilization high availability file synchronization multitenancy rapid elasticity",
body:`<table><tr><th>Model</th><th>Provider manages</th><th>Example</th></tr>
<tr><td>IaaS</td><td>Hardware, network, virtualization</td><td>Renting VMs and storage</td></tr>
<tr><td>PaaS</td><td>Also the OS and runtime</td><td>A platform for deploying your code</td></tr>
<tr><td>SaaS</td><td>Everything, including the app</td><td>Web email, office suites</td></tr></table>
<ul><li>Deployment: <b>public</b>, <b>private</b>, <b>hybrid</b> (mix), <b>community</b> (shared by organizations with common needs).</li>
<li>Characteristics: <b>shared resources</b> (multitenancy), <b>rapid elasticity</b> (scale up/down automatically), <b>metered utilization</b> (pay for use), <b>high availability</b>, <b>file synchronization</b> across devices.</li></ul>`},

{id:"net-troubleshoot", m:8, ex:1, d:5, title:"Troubleshooting network problems", kw:"intermittent connectivity slow speeds limited connectivity no connectivity apipa jitter latency packet loss poor voip port flapping high failure rate external interference",
body:`<ul><li><b>No/limited connectivity</b>: check link lights, cable, IP configuration (APIPA = DHCP problem), then default gateway and DNS.</li>
<li><b>Intermittent wireless</b>: distance, interference (microwaves, cordless phones, Bluetooth on 2.4 GHz), channel overlap. Use a Wi-Fi analyzer.</li>
<li><b>Slow speeds</b>: congestion, duplex mismatch, bad cable, too many clients on an AP.</li>
<li><b>Jitter, latency, packet loss</b>: cause poor VoIP and video quality. QoS can prioritize voice.</li>
<li><b>Port flapping</b>: a switch port repeatedly going up and down, usually from a bad cable or NIC.</li>
<li><b>External interference</b> on copper (EMI near motors, fluorescent lights): reroute or use STP/fiber.</li></ul>`},

{id:"laptop-hw", m:9, ex:1, d:1, title:"Laptop hardware replacement", kw:"laptop battery keyboard ram sodimm ssd m.2 wireless card biometric fingerprint nfc reader screen disassembly cmos",
body:`<ul><li>Commonly replaced: battery, keyboard/keys, RAM (SODIMM), storage (2.5-in or M.2), wireless card, speakers, biometrics, NFC reader, display assembly.</li>
<li>Always disconnect the battery and follow the service manual. Many modern laptops have soldered RAM and an internal battery.</li>
<li>Keep track of screw sizes; ribbon cables use ZIF connectors that lift up before the cable is removed.</li></ul>`},

{id:"mobile-display", m:9, ex:1, d:1, title:"Mobile display components", kw:"digitizer touch screen inverter backlight wifi antenna webcam microphone lcd oled display laptop lid",
body:`<ul><li><b>Digitizer</b>: the touch-sensitive layer that converts touch to input. A cracked digitizer causes unresponsive areas.</li>
<li>The laptop lid also contains the <b>Wi-Fi antenna</b> wires, <b>webcam</b>, and <b>microphone</b>. Weak Wi-Fi after a screen repair often means an antenna lead wasn't reconnected.</li>
<li>Older LCDs with CCFL backlights used an <b>inverter</b>; modern panels use LED backlights.</li></ul>`},

{id:"mobile-accessories", m:9, ex:1, d:1, title:"Mobile accessories, ports and connectivity", kw:"docking station port replicator usb-c lightning touch pen headset speakers webcam trackpad hotspot tethering cellular bluetooth pairing gps location services mdm sync",
body:`<ul><li><b>Docking station</b>: adds ports, displays, power and sometimes expansion through one connection. <b>Port replicator</b>: duplicates ports only.</li>
<li>Accessories: touch pens, headsets, speakers, webcams, trackpads, drawing pads.</li>
<li><b>Hotspot</b>: phone shares cellular data over Wi-Fi. <b>Tethering</b>: over USB or Bluetooth.</li>
<li><b>Bluetooth pairing</b>: enable Bluetooth, make discoverable, select device, enter/confirm PIN, test.</li>
<li><b>Location services</b>: GPS plus cellular location.</li>
<li><b>Synchronization</b> of contacts, calendar, email and photos to the cloud or desktop. <b>MDM</b> lets organizations push settings and apps.</li>
<li>Cellular radios can be disabled (airplane mode); eSIM/SIM cards identify the subscriber.</li></ul>`},

{id:"mobile-troubleshoot", m:9, ex:1, d:5, title:"Troubleshooting mobile device hardware", kw:"swollen battery poor battery health broken screen improper charging overheating liquid damage physical damage digitizer issues cursor drift ghost cursor degraded performance",
body:`<ul><li><b>Swollen battery</b>: stop using the device immediately; fire risk. Replace and dispose of the battery properly (recycling).</li>
<li><b>Poor battery health</b>: check battery health settings; batteries degrade with charge cycles.</li>
<li><b>Improper charging</b>: try another cable/charger, clean the port, check for damage.</li>
<li><b>Overheating</b>: blocked vents, heavy apps, failing battery.</li>
<li><b>Liquid damage</b>: power off immediately, remove battery if possible, don't charge.</li>
<li><b>Digitizer issues / ghost touches</b>: screen protector, damaged digitizer; recalibrate or replace.</li>
<li><b>Cursor drift</b> on a laptop: touchpad sensitivity, driver, or a swollen battery pressing on the touchpad.</li></ul>`},

{id:"laser-printer", m:10, ex:1, d:3, title:"Laser printers and the imaging process", kw:"laser printer imaging drum toner fuser transfer belt roller pickup separation pad duplex processing charging exposing developing transferring fusing cleaning maintenance kit",
body:`<p>The seven steps of the laser imaging process:</p>
<ol><li><b>Processing</b>: the printer builds the page image in memory (raster image).</li>
<li><b>Charging</b>: the primary charge roller (or corona) applies a uniform negative charge to the drum.</li>
<li><b>Exposing</b>: the laser discharges the drum where the image will be.</li>
<li><b>Developing</b>: toner sticks to the discharged areas.</li>
<li><b>Transferring</b>: the transfer roller/belt pulls toner from the drum onto the paper.</li>
<li><b>Fusing</b>: heat and pressure from the fuser melt toner onto paper.</li>
<li><b>Cleaning</b>: a blade removes leftover toner and the drum is neutralized.</li></ol>
<p>Parts: pickup roller, separation pad, imaging drum, fuser assembly, transfer belt/roller, duplexing assembly. Maintenance: replace toner, apply a <b>maintenance kit</b> (fuser, rollers) at the page count, calibrate, and clean. Let the fuser cool; it gets very hot.</p>`},

{id:"other-printers", m:10, ex:1, d:3, title:"Inkjet, thermal, impact and 3D printers", kw:"inkjet thermal impact dot matrix 3d printer filament resin print head carriage belt feed roller calibration heat paper ribbon tractor feed multipart forms",
body:`<ul><li><b>Inkjet</b>: ink cartridge, print head, roller, feeder, duplexing assembly, carriage and belt. Maintenance: clean heads, replace cartridges, calibrate (align), clear jams.</li>
<li><b>Thermal</b>: heat-sensitive paper and a heating element; receipts and labels. Clean the heating element; replace paper; avoid heat on stored paper.</li>
<li><b>Impact</b> (dot matrix): print head pins strike a ribbon; prints <b>multipart forms</b> (carbon copies); tractor feed paper. Replace ribbon and print head.</li>
<li><b>3D printers</b>: filament (FDM) or resin; build layers on a print bed.</li></ul>`},

{id:"printer-deploy", m:10, ex:1, d:3, title:"Printer installation, sharing and security", kw:"printer driver pcl postscript usb ethernet wireless print server share secured print badge audit log scan to email smb cloud print orientation tray duplex collate quality",
body:`<ul><li>Connect via USB, Ethernet, or wireless; install the correct driver. <b>PCL</b> vs <b>PostScript</b> drivers; PostScript is device-independent, preferred for graphics.</li>
<li>Configuration: duplex, orientation, tray selection, quality, collation.</li>
<li>Sharing: through a Windows print server, the printer's own network interface, or cloud printing.</li>
<li>Security: user authentication/badging, secured prints (release with PIN at the device), and audit logs.</li>
<li>Network scan services: scan to email, scan to folder (SMB), scan to cloud.</li>
<li>Unbox in a suitable location, follow setup docs, and consider power, ventilation and network access.</li></ul>`},

{id:"printer-troubleshoot", m:10, ex:1, d:5, title:"Troubleshooting printers", kw:"lines streaks faded print ghost images toner not fused smudge paper jam creased paper not feeding multiple pages garbled print speckling double image grinding noise wrong orientation incorrect color queue",
body:`<table><tr><th>Symptom</th><th>Likely cause</th></tr>
<tr><td>Lines down the page</td><td>Scratched drum or dirty/damaged roller; clogged inkjet nozzle</td></tr>
<tr><td>Faded print</td><td>Low toner, toner density setting</td></tr>
<tr><td>Ghost images (repeating)</td><td>Drum not cleaning properly, failing drum or cleaning blade</td></tr>
<tr><td>Toner smears/not fused (wipes off)</td><td>Failed fuser</td></tr>
<tr><td>Creased paper / multiple sheets</td><td>Worn pickup roller or separation pad, wrong paper weight, humidity</td></tr>
<tr><td>Paper not feeding</td><td>Worn pickup roller, tray settings</td></tr>
<tr><td>Garbled print</td><td>Wrong or corrupt driver</td></tr>
<tr><td>Speckling</td><td>Toner leaking or loose toner in the printer</td></tr>
<tr><td>Grinding noise</td><td>Gears, fuser, foreign object</td></tr>
<tr><td>Jobs stuck</td><td>Restart the Print Spooler service; clear queue</td></tr></table>`}
];

// Study notes — Core 2 (220-1202). Original summaries written for this app.
const KB2 = [
{id:"documentation", m:11, ex:2, d:4, title:"Ticketing and documentation", kw:"ticketing system ticket category severity escalation clear description problem resolution knowledge base article sop standard operating procedure incident report acceptable use policy aup network diagram asset management inventory",
body:`<ul><li><b>Ticket</b> contents: user info, device info, description, category, severity, escalation level, progress notes, resolution. Write clear, concise problem descriptions and resolutions.</li>
<li><b>Documentation types</b>: incident reports, standard operating procedures (SOPs, e.g., custom software install steps), new-user and end-user offboarding checklists, knowledge base articles.</li>
<li><b>Asset management</b>: inventory lists, asset tags/IDs, procurement life cycle, warranty and licensing, assigned users, configuration management database (CMDB).</li>
<li><b>Policies</b>: acceptable use policy (AUP), regulatory compliance requirements, splash screens/login banners.</li></ul>`},

{id:"change-mgmt", m:11, ex:2, d:4, title:"Change management", kw:"change management change advisory board cab request form purpose scope date time affected systems rollback plan risk analysis sandbox testing end-user acceptance responsible staff",
body:`<p>Change management keeps modifications controlled and documented.</p>
<ul><li>Documented business processes, a <b>change request form</b> including purpose, scope, date/time, affected systems, impact, and risk level.</li>
<li><b>Risk analysis</b> and a <b>rollback plan</b> (backout) in case it fails.</li>
<li>Testing in a <b>sandbox</b> before production.</li>
<li><b>Change advisory board (CAB)</b> approval; responsible staff member assigned.</li>
<li><b>End-user acceptance</b> before closing.</li></ul>`},

{id:"professionalism", m:11, ex:2, d:4, title:"Communication and professionalism", kw:"professionalism communication customer service listening punctual difficult customer avoid jargon set expectations follow up confidential private materials dress",
body:`<ul><li>Use proper language, avoid jargon, acronyms and slang. Maintain a positive attitude and project confidence.</li>
<li>Actively listen, take notes, and don't interrupt. Clarify by restating the issue.</li>
<li>Be culturally sensitive; use appropriate titles. Be on time; if late, contact the customer.</li>
<li>Avoid distractions: personal calls, texting, social media, personal interruptions.</li>
<li>Difficult customer: don't argue or become defensive, don't dismiss problems, avoid being judgmental, and don't disclose experience on social media.</li>
<li>Set and meet expectations: timeline and status, offer repair/replacement options, provide documentation, follow up to verify satisfaction.</li>
<li>Handle confidential materials on a customer's computer, desk or printer with discretion.</li></ul>`},

{id:"privacy-licensing", m:11, ex:2, d:4, title:"Licensing, regulated data, and incident response", kw:"license eula personal corporate open source subscription perpetual drm pii phi pci gdpr hipaa regulated data chain of custody incident response first response identify report preserve data retention",
body:`<ul><li><b>Licensing</b>: EULA, personal vs corporate (volume/site) licenses, open-source licenses, subscription vs perpetual, DRM. Valid licenses must be tracked.</li>
<li><b>Regulated data</b>: PII (personally identifiable information), PCI DSS (payment card data), GDPR (EU personal data), PHI (protected health information, covered by HIPAA), credit card and government-issued data. Data retention requirements apply.</li>
<li><b>Incident response</b>: identify the problem, report through proper channels (to management/law enforcement as needed), preserve data and devices, document the incident.</li>
<li><b>Chain of custody</b>: documented record of who handled evidence, when, and why, so it stays admissible.</li></ul>`},

{id:"backups", m:11, ex:2, d:4, title:"Backup and recovery", kw:"backup full incremental differential synthetic 3-2-1 grandfather father son gfs on-site off-site cloud recovery testing frequency retention",
body:`<table><tr><th>Type</th><th>What it copies</th><th>Restore needs</th></tr>
<tr><td>Full</td><td>Everything</td><td>Last full only</td></tr>
<tr><td>Incremental</td><td>Changes since last backup of any type</td><td>Full + every incremental since</td></tr>
<tr><td>Differential</td><td>Changes since last full</td><td>Full + latest differential</td></tr>
<tr><td>Synthetic full</td><td>Built from a full plus incrementals, without re-reading the source</td><td>The synthetic full</td></tr></table>
<ul><li><b>3-2-1 rule</b>: 3 copies of data, on 2 different media, 1 copy off-site.</li>
<li><b>GFS</b> (grandfather-father-son) rotation: daily, weekly, monthly sets.</li>
<li>Test restores regularly; a backup that can't be restored is useless.</li></ul>`},

{id:"safety-env", m:"A", ex:2, d:4, title:"Safety and environmental controls", kw:"safety equipment grounding electrical fire class c lifting msds sds disposal battery toner recycling temperature humidity ventilation ups surge suppressor brownout blackout power surge",
body:`<ul><li><b>Electrical safety</b>: disconnect power before repairs; equipment grounding; never open a PSU or monitor. Use a Class C fire extinguisher (or ABC) for electrical fires.</li>
<li><b>Lifting</b>: lift with your legs, keep your back straight; get help or a cart for heavy loads.</li>
<li><b>SDS/MSDS</b> (safety data sheet): handling, storage, spill and disposal information for chemicals such as toner and cleaning products.</li>
<li><b>Disposal</b>: recycle batteries, toner cartridges, and electronics following local regulations; never put lithium batteries in the trash.</li>
<li><b>Environment</b>: control temperature, humidity (too low = ESD; too high = condensation), and ventilation; use air filters/enclosures in dusty areas.</li>
<li><b>Power protection</b>: surge suppressor (spikes), <b>UPS</b> (battery backup during blackouts, brownouts; gives time for orderly shutdown).</li></ul>`},

{id:"windows-editions", m:12, ex:2, d:1, title:"Windows editions and requirements", kw:"windows 10 11 home pro pro for workstations enterprise education domain join bitlocker gpedit rdp host hyper-v n edition upgrade path requirements tpm 2.0 secure boot 4gb 64gb",
body:`<table><tr><th>Edition</th><th>Key features</th></tr>
<tr><td>Home</td><td>Consumer; no domain join, no Group Policy Editor, no BitLocker (device encryption only), can be an RDP client but not host</td></tr>
<tr><td>Pro</td><td>Domain join, BitLocker, gpedit.msc, Remote Desktop host, Hyper-V</td></tr>
<tr><td>Pro for Workstations</td><td>High-end hardware support (more CPUs/RAM), ReFS</td></tr>
<tr><td>Enterprise / Education</td><td>Volume licensing, advanced management and security features</td></tr></table>
<p><b>Windows 11 minimums</b>: 64-bit 1 GHz dual-core CPU, 4 GB RAM, 64 GB storage, UEFI with Secure Boot capability, TPM 2.0, DirectX 12 graphics.</p>
<p>Upgrade paths: in-place upgrades keep edition families (Home→Home, Pro→Pro); moving from Home to Pro requires a license upgrade. Consider end-of-life dates: unsupported versions get no security updates.</p>`},

{id:"install-methods", m:12, ex:2, d:1, title:"Installation types and boot methods", kw:"clean install in-place upgrade image deployment repair installation remote network installation pxe recovery partition zero-touch usb iso internet-based multiboot third-party drivers",
body:`<ul><li><b>Clean install</b>: wipes the partition; fresh OS. <b>In-place upgrade</b>: keeps apps, settings and files.</li>
<li><b>Image deployment</b>: apply a prepared image to many PCs. <b>Zero-touch deployment</b>: devices configure themselves from the cloud on first boot.</li>
<li><b>Repair installation</b>: reinstalls system files while keeping data.</li>
<li><b>Remote network installation</b>: booting via <b>PXE</b> (network boot) from a deployment server.</li>
<li><b>Recovery partition</b>: manufacturer's factory image.</li>
<li><b>Multiboot</b>: more than one OS on separate partitions.</li>
<li>Boot sources: USB, ISO/optical, network (PXE), internet-based, solid-state/flash, external drive.</li>
<li>Load <b>third-party drivers</b> during setup if the storage controller (e.g., RAID) isn't detected.</li></ul>`},

{id:"partitions-fs", m:12, ex:2, d:1, title:"Partitioning and file systems", kw:"gpt mbr partition primary extended logical 2tb 128 partitions ntfs fat32 exfat refs ext4 xfs apfs hfs+ 4gb file limit quick format full format",
body:`<ul><li><b>MBR</b>: up to 4 primary partitions (or 3 + 1 extended with logical drives); 2 TB disk limit; legacy BIOS.</li>
<li><b>GPT</b>: up to 128 partitions in Windows; disks larger than 2 TB; required for UEFI boot of Windows 11.</li></ul>
<table><tr><th>File system</th><th>Used by</th><th>Notes</th></tr>
<tr><td>NTFS</td><td>Windows</td><td>Permissions, encryption (EFS), compression, journaling</td></tr>
<tr><td>FAT32</td><td>Universal</td><td>4 GB max file size; small flash drives</td></tr>
<tr><td>exFAT</td><td>Windows, macOS, cameras</td><td>Large files, cross-platform removable drives</td></tr>
<tr><td>ReFS</td><td>Windows Server, Pro for Workstations</td><td>Resilient file system for large data</td></tr>
<tr><td>APFS</td><td>macOS</td><td>Replaced HFS+</td></tr>
<tr><td>ext4, XFS</td><td>Linux</td><td>Journaling Linux file systems</td></tr></table>
<p>A <b>quick format</b> just rebuilds the file table; a <b>full format</b> also scans for bad sectors (and in Windows overwrites with zeros).</p>`},

{id:"workgroup-domain", m:12, ex:2, d:1, title:"Workgroups, domains and account setup", kw:"workgroup domain active directory homegroup local account microsoft account time date region language settings post install",
body:`<ul><li><b>Workgroup</b>: peer-to-peer; each computer keeps its own local accounts. Fine for small offices.</li>
<li><b>Domain</b>: centralized accounts and policies managed on a domain controller (Active Directory). Requires Windows Pro or higher.</li>
<li>After install: activate Windows, install drivers and updates, configure accounts, restore user data, install apps, and confirm the time zone, date, region and language.</li></ul>`},

{id:"windows-tools", m:13, ex:2, d:1, title:"Windows administrative tools (MMC snap-ins)", kw:"task manager event viewer disk management task scheduler device manager certificate manager certmgr local users and groups lusrmgr performance monitor perfmon group policy editor gpedit msc services msconfig regedit resmon msinfo32 dxdiag disk cleanup cleanmgr defrag",
body:`<table><tr><th>Tool</th><th>Command</th><th>Use</th></tr>
<tr><td>Event Viewer</td><td>eventvwr.msc</td><td>System, Application, Security logs</td></tr>
<tr><td>Disk Management</td><td>diskmgmt.msc</td><td>Partition, format, assign letters, initialize disks</td></tr>
<tr><td>Task Scheduler</td><td>taskschd.msc</td><td>Run tasks at times or events</td></tr>
<tr><td>Device Manager</td><td>devmgmt.msc</td><td>Drivers: update, roll back, disable</td></tr>
<tr><td>Certificate Manager</td><td>certmgr.msc</td><td>User certificates</td></tr>
<tr><td>Local Users and Groups</td><td>lusrmgr.msc</td><td>Local accounts (not on Home)</td></tr>
<tr><td>Performance Monitor</td><td>perfmon.msc</td><td>Counters, logs over time</td></tr>
<tr><td>Local Group Policy Editor</td><td>gpedit.msc</td><td>Policies (not on Home)</td></tr>
<tr><td>Services</td><td>services.msc</td><td>Start/stop, startup type</td></tr>
<tr><td>System Configuration</td><td>msconfig</td><td>Boot options, safe boot, services</td></tr>
<tr><td>Registry Editor</td><td>regedit</td><td>Edit registry (back up first)</td></tr>
<tr><td>Resource Monitor</td><td>resmon</td><td>Real-time CPU, disk, network, memory per process</td></tr>
<tr><td>System Information</td><td>msinfo32</td><td>Hardware/software summary</td></tr>
<tr><td>DirectX Diagnostic</td><td>dxdiag</td><td>Display/sound diagnostics</td></tr>
<tr><td>Disk Cleanup</td><td>cleanmgr</td><td>Remove temp files</td></tr>
<tr><td>Defragment and Optimize</td><td>dfrgui</td><td>Defrag HDD, TRIM SSD</td></tr></table>
<p><b>Task Manager</b> (Ctrl+Shift+Esc) tabs: Processes, Performance, App history, Startup apps, Users, Details, Services.</p>`},

{id:"cmd-tools", m:13, ex:2, d:1, title:"Windows command-line tools", kw:"cmd command prompt cd dir md rmdir copy xcopy robocopy chkdsk sfc diskpart format gpupdate gpresult winver shutdown net use net user hostname ipconfig ping tracert pathping nslookup netstat help admin elevated",
body:`<table><tr><th>Command</th><th>Purpose</th></tr>
<tr><td>cd, dir, md, rmdir</td><td>Navigate, list, make and remove directories</td></tr>
<tr><td>copy, xcopy, robocopy</td><td>Copy files; robocopy is robust (retries, mirrors, logs)</td></tr>
<tr><td>chkdsk /f /r</td><td>Fix file system errors (/f); locate bad sectors and recover (/r)</td></tr>
<tr><td>sfc /scannow</td><td>System File Checker: repair protected system files</td></tr>
<tr><td>diskpart</td><td>Partition management from the command line</td></tr>
<tr><td>format</td><td>Format a volume</td></tr>
<tr><td>gpupdate /force</td><td>Apply Group Policy now</td></tr>
<tr><td>gpresult /r</td><td>Show applied policies (RSoP)</td></tr>
<tr><td>winver</td><td>Show Windows version/build</td></tr>
<tr><td>shutdown /r /t 0</td><td>Restart immediately; /s shut down</td></tr>
<tr><td>net use</td><td>Map a network drive (net use Z: \\\\server\\share)</td></tr>
<tr><td>net user</td><td>Manage local user accounts</td></tr>
<tr><td>hostname</td><td>Show computer name</td></tr>
<tr><td>[command] /?</td><td>Help for any command</td></tr></table>
<p>Many commands (sfc, chkdsk, diskpart) require an <b>elevated</b> (Run as administrator) prompt. Network commands (ipconfig, ping, tracert, pathping, nslookup, netstat) are covered in Module 19.</p>`},

{id:"settings-cpl", m:13, ex:2, d:1, title:"Control Panel and Settings apps", kw:"control panel settings internet options devices and printers programs and features network and sharing center system windows defender firewall mail sound user accounts device manager indexing options file explorer options show hidden files power options hibernate sleep fast startup ease of access",
body:`<ul><li><b>Control Panel</b> utilities: Internet Options, Devices and Printers, Programs and Features, Network and Sharing Center, System, Windows Defender Firewall, Mail, Sound, User Accounts, Device Manager, Indexing Options, Administrative Tools, File Explorer Options, Power Options, Ease of Access.</li>
<li><b>File Explorer Options</b>: show hidden files, hide extensions, general and view options.</li>
<li><b>Power Options</b>: hibernate (saves RAM to disk, uses no power), sleep/suspend, fast startup, power plans, USB selective suspend, lid close behavior.</li>
<li><b>Settings app</b>: Time and Language, Update and Security (Windows Update), Personalization, Apps, Privacy, System, Devices, Network and Internet, Gaming, Accounts.</li></ul>`},

{id:"windows-updates", m:13, ex:2, d:1, title:"Updates, patches and app installation", kw:"windows update patch feature update quality update driver update firmware app installation requirements 32-bit 64-bit dedicated graphics vram ram storage distribution method physical media downloadable iso impact to device network operation",
body:`<ul><li><b>Quality updates</b>: security and bug fixes, monthly. <b>Feature updates</b>: new versions yearly. Also driver and firmware updates.</li>
<li>Test updates before broad deployment; schedule them to avoid disruption.</li>
<li>App installation considerations: 32-bit vs 64-bit (64-bit OS runs both; 32-bit OS can't run 64-bit apps), dedicated graphics vs integrated, VRAM, RAM and storage requirements, external hardware tokens, distribution method (physical media, ISO mount, download, app store), and impact on the device, network, operations and business.</li></ul>`},

{id:"sw-troubleshoot", m:14, ex:2, d:3, title:"Troubleshooting Windows after startup", kw:"slow performance application crashing service fails to start low memory warnings usb controller resource warning time drift profile load sluggish frequent shutdowns system instability no os found bsod upgrade failure",
body:`<table><tr><th>Symptom</th><th>Common fixes</th></tr>
<tr><td>Sluggish performance</td><td>Check Task Manager for resource hogs, disable startup apps, scan for malware, add RAM, check disk space</td></tr>
<tr><td>Application crashes</td><td>Update/repair/reinstall app, check Event Viewer, compatibility mode</td></tr>
<tr><td>Service fails to start</td><td>services.msc: check dependencies, startup type, account; Event Viewer</td></tr>
<tr><td>Low memory warnings</td><td>Close apps, increase paging file, add RAM</td></tr>
<tr><td>USB controller resource warnings</td><td>Too many devices on one controller; move devices to another port/controller</td></tr>
<tr><td>Time drift</td><td>Sync with time server; replace CMOS battery</td></tr>
<tr><td>User profile fails to load</td><td>Rebuild the profile (rename and log in fresh), copy data over</td></tr>
<tr><td>Random/frequent shutdowns, instability</td><td>Overheating, drivers, recent updates, malware</td></tr>
<tr><td>Upgrade failures</td><td>Free space, incompatible drivers/apps, check logs</td></tr></table>
<p>Remediation tools: reboot, restart services, uninstall/reinstall/update apps, add resources, verify requirements, <b>sfc</b>, repair Windows, <b>System Restore</b> (rolls back system files/registry; not personal files), reimage/reload, roll back updates or drivers, rebuild profiles.</p>
<p><b>Reliability Monitor</b> (Control Panel → Security and Maintenance → View reliability history) charts app crashes, Windows failures and updates by date, which helps pinpoint when a problem started.</p>`},

{id:"startup-troubleshoot", m:15, ex:2, d:3, title:"Troubleshooting Windows startup", kw:"boot process winre windows recovery environment startup repair safe mode startup settings bootrec fixmbr fixboot rebuildbcd bcdedit no os found bsod stop error inaccessible boot device reset this pc system image recovery last known good",
body:`<ul><li><b>Boot sequence</b> (UEFI): POST → UEFI firmware finds boot loader on the EFI system partition → Windows Boot Manager (bootmgfw.efi) → Windows Boot Loader (winload.efi) → kernel (ntoskrnl.exe) → services → logon.</li>
